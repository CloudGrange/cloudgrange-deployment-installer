#
# Azure Developer CLI (azd) manifest for CloudSmith MVP — Azure PaaS (Model B).
# Per ADR-043 (azd + Bicep). Container images are prebuilt and published to
# ghcr.io by each service repo's CI (ADR-046); azd provisions the infra and the
# Container Apps reference those images directly.
#
# Usage:
#   azd env new cloudsmith-mvp
#   azd env set ENTRA_TENANT_ID <tenant-guid>
#   azd env set ENTRA_CLIENT_ID <app-client-id>
#   azd env set ENTRA_CLIENT_SECRET <secret> --secret
#   azd env set POSTGRES_ADMIN_PASSWORD <password> --secret
#   # while images remain private (until ADR-046 public flip):
#   azd env set GHCR_USERNAME <github-user>
#   azd env set GHCR_TOKEN <read-packages-pat> --secret
#   azd provision

name: cloudsmith-mvp
metadata:
  template: cloudsmith-mvp@0.1.0

infra:
  provider: bicep
  path: .
  module: main

# Post-provision hook — runs FluentMigrator migrations via the cloudsmith-api container (AB#1605).
# The API is designed to auto-migrate on startup (CoreKernelExtensions.MigrateCloudSmithDatabase);
# the hook restarts the API ACA revision so the migration runs in a known-fresh context
# and then polls the /health/ready endpoint to confirm the API became healthy.
# AB#1669 — added health-check poll (HIGH operational excellence finding from WAF-CAF assessment).
hooks:
  postprovision:
    shell: sh
    run: |
      set -e
      echo "Running post-provision migration restart..."
      API_APP=$(azd env get-value API_APP_NAME 2>/dev/null || echo "")
      # AB#2412 — main.bicep output is RESOURCE_GROUP_NAME (not AZURE_RESOURCE_GROUP).
      # azd also populates the built-in AZURE_RESOURCE_GROUP env var from the resource group
      # created during provision, so check both to stay forward-compatible.
      RG=$(azd env get-value RESOURCE_GROUP_NAME 2>/dev/null || azd env get-value AZURE_RESOURCE_GROUP 2>/dev/null || echo "")
      if [ -z "$API_APP" ] || [ -z "$RG" ]; then
        echo "WARNING: API_APP_NAME or AZURE_RESOURCE_GROUP not set in azd env — skipping migration restart."
        exit 0
      fi

      # Restart the latest active revision to force migration run
      ACTIVE_REVISION=$(az containerapp revision list \
        --name "$API_APP" \
        --resource-group "$RG" \
        --query '[?properties.active==`true`].name | [0]' \
        -o tsv 2>/dev/null || echo "")

      if [ -n "$ACTIVE_REVISION" ]; then
        az containerapp revision restart \
          --name "$API_APP" \
          --resource-group "$RG" \
          --revision "$ACTIVE_REVISION"
        echo "Migration restart issued for revision: $ACTIVE_REVISION"
      else
        echo "WARNING: No active revision found — skipping restart."
      fi

      # AB#1669 — poll /health/ready until the API reports healthy or timeout expires.
      # Resolves the HIGH operational excellence finding: the hook previously completed
      # immediately after restart, hiding crash-loop failures from the operator.
      echo "Waiting for API to become healthy..."
      MAX_WAIT=120
      INTERVAL=10
      ELAPSED=0
      FQDN=$(az containerapp show \
        --name "$API_APP" \
        --resource-group "$RG" \
        --query 'properties.configuration.ingress.fqdn' \
        -o tsv 2>/dev/null || echo "")

      if [ -z "$FQDN" ]; then
        echo "WARNING: Could not retrieve API FQDN — skipping health check."
      else
        while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${FQDN}/health/ready" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "API is healthy (HTTP 200 from /health/ready)."
            break
          fi
          echo "API not yet healthy (HTTP $HTTP_CODE) — waiting ${INTERVAL}s (${ELAPSED}/${MAX_WAIT}s elapsed)..."
          sleep "$INTERVAL"
          ELAPSED=$((ELAPSED + INTERVAL))
        done
        if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
          echo "WARNING: API did not become healthy within ${MAX_WAIT}s. Check container logs:"
          echo "  az containerapp logs show --name $API_APP --resource-group $RG --follow"
          # Not a hard failure — operator may be deploying to a cold environment.
          # continueOnError is set below so provisioning reports success regardless.
        fi
      fi

      # AB#1628 — print the first-run setup URL after provision
      PORTAL_URL=$(azd env get-value PORTAL_URL 2>/dev/null || echo "")
      if [ -n "$PORTAL_URL" ]; then
        echo ""
        echo "============================================================"
        echo "  CloudSmith is provisioned and ready for first-run setup."
        echo ""
        echo "  Open this URL to complete setup:"
        echo "  ${PORTAL_URL}/setup"
        echo "============================================================"
      fi
    continueOnError: true
