global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cloudsmith-api
    static_configs:
      # API listens on 8080 inside the Docker network (ASPNETCORE_URLS=http://+:8080)
      - targets: ['cloudsmith-api:8080']
    metrics_path: /metrics
    scheme: http

  - job_name: cloudsmith-relay
    static_configs:
      # Relay LAN listener — port matches RELAY_LISTEN_PORT (default 8080 in Program.cs;
      # set to 8443 for the relay profile in docker-compose.yml).
      # When the relay profile is enabled, this target scrapes relay process metrics.
      - targets: ['cloudsmith-relay:8080']
    metrics_path: /metrics
    scheme: http
