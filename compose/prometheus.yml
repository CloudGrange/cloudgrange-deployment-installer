global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cloudgrange-api
    static_configs:
      # API listens on 8080 inside the Docker network (ASPNETCORE_URLS=http://+:8080)
      - targets: ['cloudgrange-api:8080']
    metrics_path: /metrics
    scheme: http

  - job_name: cloudgrange-relay
    static_configs:
      # Relay LAN listener — port matches RELAY_LISTEN_PORT=8443 in docker-compose.yml (AB#8129).
      # The listener is plain HTTP today (Kestrel ListenAnyIP); the relay exposes no /metrics
      # endpoint yet, so this target reports DOWN until relay metrics are implemented.
      - targets: ['cloudgrange-relay:8443']
    metrics_path: /metrics
    scheme: http
