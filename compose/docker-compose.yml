name: cloudsmith

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: start-dev --import-realm
    restart: always
    environment:
      KC_DB: dev-file
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HTTP_PORT: "8080"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/cloudsmith-realm.json:/opt/keycloak/data/import/cloudsmith-realm.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "(echo >/dev/tcp/localhost/8080) 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cloudsmith

  cloudsmith-api:
    image: ghcr.io/cloudsmith-cloud/cloudsmith-api:${CLOUDSMITH_VERSION:-latest}
    restart: always
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=${CLOUDSMITH_DB_CONNECTION}
      - Keycloak__Authority=${CLOUDSMITH_KEYCLOAK_AUTHORITY:-http://keycloak:8080/realms/cloudsmith}
      - Keycloak__ClientId=${CLOUDSMITH_KEYCLOAK_CLIENT_ID:-cloudsmith-api}
      - Keycloak__ClientSecret=${CLOUDSMITH_KEYCLOAK_CLIENT_SECRET}
      - Keycloak__RequireHttpsMetadata=false
      - OpenTelemetry__Endpoint=${CLOUDSMITH_OTLP_ENDPOINT:-http://otel-collector:4317}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - cloudsmith

  cloudsmith-portal:
    image: ghcr.io/cloudsmith-cloud/cloudsmith-portal:${CLOUDSMITH_VERSION:-latest}
    restart: always
    ports:
      - "80:80"
    environment:
      - CLOUDSMITH_API_URL=
      - CLOUDSMITH_AUTH_URL=${CLOUDSMITH_KEYCLOAK_AUTHORITY:-http://localhost:8080/realms/cloudsmith}
    depends_on:
      - cloudsmith-api
    networks:
      - cloudsmith

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-cloudsmith}
      - POSTGRES_USER=${POSTGRES_USER:-cloudsmith}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudsmith} -d ${POSTGRES_DB:-cloudsmith}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudsmith

  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    networks:
      - cloudsmith

  loki:
    image: grafana/loki:latest
    restart: always
    volumes:
      - loki_data:/loki
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - cloudsmith

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: always
    volumes:
      - ./otel-collector.yml:/etc/otel/config.yaml:ro
    command: ["--config=/etc/otel/config.yaml"]
    networks:
      - cloudsmith

volumes:
  postgres_data:
  prometheus_data:
  loki_data:

networks:
  cloudsmith:
    driver: bridge
