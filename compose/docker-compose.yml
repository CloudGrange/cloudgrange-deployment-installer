# CloudGrange on-premises Docker Compose stack (one Ubuntu VM; HA later via Hyper-V failover clustering)
#
# This file is the source of truth for the service list (AB#8129). Default services:
#   First-party: cloudgrange-api, cloudgrange-portal, cloudgrange-relay
#   Platform:    nginx (ingress/TLS), postgres, keycloak (ADR-008)
#   Observability (ADR-016): otel-collector -> prometheus + loki, grafana
# Secrets use the PostgreSQL-encrypted provider by default (ADR-009); OpenBao is optional and not
# part of this stack. Entra ID is optional and not bundled. The relay runs as a Compose container and
# the whole stack is supervised by systemd (systemd/cloudgrange.service, ADR-059).
# The runtime agent is a Windows host service, not a container; it is not part of this file.
#
# Required environment variables (set in .env; Deploy-DockerCompose writes /opt/cloudgrange/.env):
#   POSTGRES_PASSWORD         — PostgreSQL superuser password
#   KEYCLOAK_ADMIN_USER       — Keycloak bootstrap admin username
#   KEYCLOAK_ADMIN_PASSWORD   — Keycloak bootstrap admin password
#   GRAFANA_ADMIN_PASSWORD    — Grafana admin password
#   RELAY_ENROLLMENT_TOKEN    — Shared token agents use to enroll with the relay
#
# Optional environment variables:
#   CLOUDGRANGE_VERSION       — First-party image tag (default: latest)
#   CLOUDGRANGE_API_URL       — Public URL of the API (e.g. https://cloudgrange.example.com)
#   CLOUDGRANGE_DB_CONNECTION — Full connection string (overrides auto-generated from POSTGRES_* vars)
#   CLOUDGRANGE_OTLP_ENDPOINT — OTel collector gRPC endpoint (default: http://otel-collector:4317)
#   CLOUDGRANGE_HOSTNAME      — Keycloak external hostname (default: localhost)

name: cloudgrange

services:
  cloudgrange-api:
    image: ghcr.io/cloudgrange/cloudgrange-api:${CLOUDGRANGE_VERSION:-latest}
    restart: always
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=${CLOUDGRANGE_DB_CONNECTION:-Host=postgres;Port=5432;Database=${POSTGRES_DB:-cloudgrange};Username=${POSTGRES_USER:-cloudgrange};Password=${POSTGRES_PASSWORD}}
      - OpenTelemetry__Endpoint=${CLOUDGRANGE_OTLP_ENDPOINT:-http://otel-collector:4317}
      # AB#2348 / BUG-4: default portal URL so the API health monitor can probe portal:80
      # over the internal Docker network. Without this, the probe logs "invalid request URI"
      # every cycle. Override CLOUDGRANGE_PORTAL_URL only if the portal runs out-of-stack.
      - CLOUDGRANGE_PORTAL_URL=${CLOUDGRANGE_PORTAL_URL:-http://cloudgrange-portal:80}
      # AB#8129 / ADR-008: local Keycloak. Authority uses the in-network service name.
      - Keycloak__Authority=${CLOUDGRANGE_KEYCLOAK_AUTHORITY:-http://keycloak:8080/realms/cloudgrange}
      - Keycloak__ClientId=${CLOUDGRANGE_KEYCLOAK_CLIENT_ID:-cloudgrange-api}
      - Keycloak__ClientSecret=${KEYCLOAK_API_CLIENT_SECRET}
      - Keycloak__RequireHttpsMetadata=false
    volumes:
      # ADR-009: the PostgreSQL-encrypted secrets provider's master key (/etc/cloudgrange/secrets.key).
      - api_secrets:/etc/cloudgrange
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudgrange

  cloudgrange-portal:
    image: ghcr.io/cloudgrange/cloudgrange-portal:${CLOUDGRANGE_VERSION:-latest}
    restart: always
    # AB#1593: port 443 is now handled by the nginx TLS terminator.
    # Port 80 is internal only (not exposed on the host); nginx proxies to it.
    expose:
      - "80"
    environment:
      # Required by the portal entrypoint: nginx reverse-proxies /api/, /hubs/, /health/ here.
      - CLOUDGRANGE_API_UPSTREAM=http://cloudgrange-api:8080
      # Empty apiUrl = same-origin relative calls through the portal proxy (no https->http mixed content).
      - CLOUDGRANGE_API_URL=${CLOUDGRANGE_PORTAL_API_URL:-}
    depends_on:
      cloudgrange-api:
        condition: service_healthy
    networks:
      - cloudgrange

  # AB#8129 / ADR-059: the relay is a default Compose container; systemd supervises the stack.
  # Agents on managed Hyper-V hosts connect to it over mTLS (ADR-008).
  cloudgrange-relay:
    image: ghcr.io/cloudgrange/cloudgrange-relay:${CLOUDGRANGE_VERSION:-latest}
    restart: always
    ports:
      - "8443:8443"
    environment:
      - RELAY_PAAS_URL=http://cloudgrange-api:8080
      - RELAY_ENROLLMENT_TOKEN=${RELAY_ENROLLMENT_TOKEN}
      - RELAY_DISPLAY_NAME=${RELAY_DISPLAY_NAME:-site-relay}
      - RELAY_CLUSTER_ID=${RELAY_CLUSTER_ID:-default}
      - RELAY_LISTEN_PORT=8443
      - RELAY_IDENTITY_DIR=/var/lib/cloudgrange-relay/identity
      - Logging__LogLevel__Default=Information
    volumes:
      # The image declares this path as a volume; name it so the enrolled identity survives upgrades.
      - relay_identity:/var/lib/cloudgrange-relay/identity
    depends_on:
      cloudgrange-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "(echo > /dev/tcp/localhost/8443) 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cloudgrange

  # AB#1593: nginx TLS terminator — terminates HTTPS on 443, proxies to portal on port 80.
  # Self-signed cert is generated at install time; mounted from the nginx_certs named volume.
  # To use a CA-signed cert, replace the contents of the nginx_certs volume with your cert files.
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs:ro
    depends_on:
      - cloudgrange-portal
    networks:
      - cloudgrange

  postgres:
    # PostgreSQL 17 per docs/product-installer-design.md.
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-cloudgrange}
      - POSTGRES_USER=${POSTGRES_USER:-cloudgrange}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudgrange} -d ${POSTGRES_DB:-cloudgrange}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudgrange

  # AB#8129 / ADR-008: local Keycloak is a default service (previously the optional "keycloak" profile).
  # AB#1592: production start (not start-dev) with realm import on first boot, PostgreSQL backend.
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: start --import-realm
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cloudgrange}
      KC_DB_USERNAME: ${POSTGRES_USER:-cloudgrange}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${CLOUDGRANGE_HOSTNAME:-localhost}
      KC_HTTP_PORT: "8080"
      # KC_HTTP_ENABLED required in production mode when TLS termination is handled externally.
      KC_HTTP_ENABLED: "true"
      # Bootstrap admin — only used on first run to create the initial admin account.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Substituted into cloudgrange-realm.json ("secret": "${KEYCLOAK_API_CLIENT_SECRET}") at import.
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET}
    volumes:
      - ./keycloak/cloudgrange-realm.json:/opt/keycloak/data/import/cloudgrange-realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "(echo >/dev/tcp/localhost/8080) 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cloudgrange

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: always
    volumes:
      - ./otel-collector.yml:/etc/otel/config.yaml:ro
    command: ["--config=/etc/otel/config.yaml"]
    networks:
      - cloudgrange

  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # The OTel collector exports metrics with prometheusremotewrite (otel-collector.yml).
      - --web.enable-remote-write-receiver
    networks:
      - cloudgrange

  loki:
    image: grafana/loki:latest
    restart: always
    volumes:
      - loki_data:/loki
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - cloudgrange

  # AB#8129 / ADR-016: Grafana over Prometheus (metrics) and Loki (logs). Internal only;
  # reach it through an SSH tunnel or add an nginx route when operators need it.
  grafana:
    image: grafana/grafana:12.1.1
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - cloudgrange

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:
  relay_identity:
  api_secrets:
  # AB#1593: TLS certs for nginx. Populated by New-SelfSignedCert.ps1 at install time.
  # Replace with CA-signed certs for production use.
  nginx_certs:

networks:
  cloudgrange:
    driver: bridge
