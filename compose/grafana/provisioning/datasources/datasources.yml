# AB#8129 / ADR-016: Grafana reads metrics from Prometheus and logs from Loki.
# Both are fed by the OpenTelemetry collector (otel-collector.yml).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
