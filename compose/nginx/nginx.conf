# CloudGrange nginx TLS terminator (AB#1593)
# Terminates HTTPS on port 443 and proxies to cloudgrange-portal on port 80 (internal).
# Self-signed certificate is generated at install time and mounted into /etc/nginx/certs/.
# In production, replace the self-signed cert with a CA-signed certificate.

events {
    worker_connections 1024;
}

http {
    # Disable server version disclosure
    server_tokens off;

    # Connection timeouts
    client_header_timeout  15s;
    client_body_timeout    30s;
    send_timeout           30s;
    keepalive_timeout      65s;

    # Upstream — cloudgrange-portal container on the internal Docker network
    upstream cloudgrange_portal {
        server cloudgrange-portal:80;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # TLS certificate — mounted from named volume nginx_certs at install time
        ssl_certificate     /etc/nginx/certs/cloudgrange.crt;
        ssl_certificate_key /etc/nginx/certs/cloudgrange.key;

        # TLS hardening
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    nosniff                                always;
        add_header X-Frame-Options           SAMEORIGIN                             always;
        add_header X-XSS-Protection          "1; mode=block"                        always;

        location / {
            proxy_pass         http://cloudgrange_portal;
            proxy_http_version 1.1;

            # Pass original host and client IP
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            # WebSocket support (portal uses SignalR / live updates)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_read_timeout 90s;
        }

        # AB#8129: publish local Keycloak (ADR-008) on the same origin so the browser login and the
        # token issuer are https://<host>/realms/cloudgrange. Only the cloudgrange realm (OIDC) and
        # static resources are published. The master realm (bootstrap admin login/token) and the
        # admin console/REST API are NOT reachable through nginx.
        location = /admin { return 404; }
        location /admin/ { return 404; }
        location /realms/ { return 404; }
        location /realms/cloudgrange/ {
            proxy_pass         http://keycloak:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  443;
            proxy_buffer_size  64k;
            proxy_buffers      8 64k;
        }
        location /resources/ {
            proxy_pass         http://keycloak:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  443;
        }

        # AB#8129: release bundle upload for in-app updates (Platform administration -> Updates). Proxied straight to
        # the API, not through the portal, so a multi-GB bundle streams without buffering. The API enforces
        # platform:admin and its own size limit. Resolved per request so a recreated API container is found.
        location = /api/v1/platform/update/upload {
            client_max_body_size    8g;
            client_body_timeout     300s;
            proxy_request_buffering off;
            resolver                127.0.0.11 valid=30s ipv6=off;
            set $api_upstream       http://cloudgrange-api:8080;
            proxy_pass              $api_upstream;
            proxy_http_version      1.1;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto https;
            proxy_send_timeout      600s;
            proxy_read_timeout      600s;
        }

        # Portal health probe passthrough
        location /health {
            proxy_pass         http://cloudgrange_portal/health;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
        }
    }

    # AB#8129: agent <-> relay. Host agents on the Hyper-V hosts reach the relay's agent API over TLS on 8443.
    # Only the agent routes under /lan/v1/agents/ are published (enroll, heartbeat, inventory, health,
    # hardware, jobs, job results; GET and POST only). The relay's /metrics and /health stay internal.
    # The operator-only POST /lan/v1/agents/reenrollment-approvals (X-Relay-Admin-Token) returns 404 here:
    # re-enrollment approval is local to the appliance, never over the LAN listener.
    # Both restrictions are asserted by scripts/Test-ComposeHardening.py.
    # Agent mTLS is not implemented yet: enrollment uses the relay enrollment token, and agents validate this
    # certificate against their trust store (install a CA-signed certificate, or trust the appliance's).
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cloudgrange.crt;
        ssl_certificate_key /etc/nginx/certs/cloudgrange.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;

        client_max_body_size 16m;

        # Resolve the relay per request through Docker's embedded DNS, so nginx starts even if the relay
        # container starts later.
        resolver 127.0.0.11 valid=30s ipv6=off;

        location ^~ /lan/v1/agents/ {
            # Case-insensitive because the relay's routing is. nginx matches the normalized path, so
            # percent-encoded, dot-segment and double-slash forms of the path are refused as well.
            location ~* ^/lan/v1/agents/+reenrollment-approvals {
                return 404;
            }
            limit_except GET POST { deny all; }
            set $relay_upstream http://cloudgrange-relay:8443;
            proxy_pass         $relay_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 90s;
        }

        location / {
            return 404;
        }
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
