# CloudGrange nginx TLS terminator (AB#1593)
# Terminates HTTPS on port 443 and proxies to cloudgrange-portal on port 80 (internal).
# Self-signed certificate is generated at install time and mounted into /etc/nginx/certs/.
# In production, replace the self-signed cert with a CA-signed certificate.

events {
    worker_connections 1024;
}

http {
    # Disable server version disclosure
    server_tokens off;

    # Connection timeouts
    client_header_timeout  15s;
    client_body_timeout    30s;
    send_timeout           30s;
    keepalive_timeout      65s;

    # Upstream — cloudgrange-portal container on the internal Docker network
    upstream cloudgrange_portal {
        server cloudgrange-portal:80;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # TLS certificate — mounted from named volume nginx_certs at install time
        ssl_certificate     /etc/nginx/certs/cloudgrange.crt;
        ssl_certificate_key /etc/nginx/certs/cloudgrange.key;

        # TLS hardening
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    nosniff                                always;
        add_header X-Frame-Options           SAMEORIGIN                             always;
        add_header X-XSS-Protection          "1; mode=block"                        always;

        location / {
            proxy_pass         http://cloudgrange_portal;
            proxy_http_version 1.1;

            # Pass original host and client IP
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            # WebSocket support (portal uses SignalR / live updates)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_read_timeout 90s;
        }

        # Portal health probe passthrough
        location /health {
            proxy_pass         http://cloudgrange_portal/health;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
        }
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
