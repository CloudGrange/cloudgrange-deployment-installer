name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: write
  security-events: write
jobs:
  dco:
    if: github.event_name == 'pull_request'
    uses: cloudgrange-cloud/cloudgrange-workflows/.github/workflows/dco-check.yml@v1.0.0
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors -and $parseErrors.Count -gt 0) { $errors += "$($_.FullName): $parseErrors" }
          }
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($results) { $results | Format-Table -AutoSize; exit 1 }
  docker:
    if: github.ref == 'refs/heads/main'
    needs: [validate]
    uses: cloudgrange-cloud/cloudgrange-workflows/.github/workflows/docker-build-push.yml@v1.0.0
    with:
      image-name: cloudgrange-installer
    secrets: inherit
  trivy:
    if: github.ref == 'refs/heads/main'
    needs: [docker]
    uses: cloudgrange-cloud/cloudgrange-workflows/.github/workflows/trivy-scan.yml@v1.0.0
    with:
      image-ref: ghcr.io/cloudgrange-cloud/cloudgrange-installer:latest
      # Report-only in CI — do not block the pipeline on CVEs during MVP.
      # CVEs are visible in the GitHub Security tab via the SARIF upload.
      fail-on-critical: false
    secrets: inherit