name: Installer source qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    # Established CloudGrange fallback pending F01 runner admission.
    runs-on: [self-hosted, linux, x64, hcs]
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify author signoffs
        if: github.event_name == 'pull_request'
        env:
          DCO_BASE: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          #Requires -Version 7.0
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          if($env:DCO_BASE -notmatch '^[a-f0-9]{40}$' -or $env:DCO_HEAD -notmatch '^[a-f0-9]{40}$'){throw 'Invalid commit range'}
          $commits=@(git rev-list ($env:DCO_BASE+'..'+$env:DCO_HEAD))
          if($LASTEXITCODE -ne 0 -or -not $commits.Count){throw 'No proposed commits'}
          foreach($commit in $commits){
            $author=git show -s --format='%an <%ae>' $commit
            if($LASTEXITCODE -ne 0){throw 'Author unavailable'}
            $trailers=@(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' $commit)
            if($LASTEXITCODE -ne 0 -or -not @($trailers|Where-Object {$_.Trim() -ieq $author.Trim()}).Count){throw 'Author signoff missing'}
          }
      - name: Qualify installer source
        env:
          INSTALLER_EVIDENCE: ${{ runner.temp }}/installer-source
        run: |
          #Requires -Version 7.0
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          ./test/Invoke-InstallerSourceQualification.ps1 -EvidenceDirectory $env:INSTALLER_EVIDENCE
      - name: Appliance and compose security gates (AB#8129)
        shell: bash
        run: |
          set -euo pipefail
          # PyYAML for the raw compose allowlist. The gate tests FAIL (not skip) if Docker, PyYAML or root is
          # missing; CLOUDGRANGE_TEST_ALLOW_SKIP must never be set here.
          sudo apt-get install -y --no-install-recommends python3-yaml
          test -z "${CLOUDGRANGE_TEST_ALLOW_SKIP:-}"
          # Compose hardening and image-pin gates (planted regressions in test_compose_gates.py).
          python3 scripts/Test-ComposeHardening.py compose
          sudo -E python3 -m unittest discover -v -s test/appliance -p 'test_install_scripts.py'
          python3 -m unittest discover -v -s test/appliance -p 'test_compose_gates.py'
          # Every installer ssh/scp call is bounded: BatchMode, connect/keepalive timeouts, overall timeout.
          python3 scripts/Test-SshTransportOptions.py .
          python3 -m unittest discover -v -s test/appliance -p 'test_ssh_transport.py'
          # KVP writer and operator-access cleanup run as root (the pool must be root-owned).
          sudo -E python3 -m unittest discover -v -s test/appliance -p 'test_kvp_writer.py'
          sudo -E python3 -m unittest discover -v -s test/appliance -p 'test_operator_access.py'
      - name: Retain original qualification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installer-source
          if-no-files-found: error
          retention-days: 30
