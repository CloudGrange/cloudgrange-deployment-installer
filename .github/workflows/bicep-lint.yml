name: Bicep Lint + CAF Naming Check
# AB#1668 — Bicep lint CI gate + CAF naming validation
# Triggers on every PR and push to main that touches the iac/ directory.
on:
  push:
    branches: [main]
    paths:
      - 'iac/**'
      - '.github/workflows/bicep-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'iac/**'
      - '.github/workflows/bicep-lint.yml'

permissions:
  contents: read

jobs:
  bicep-lint:
    name: Bicep lint and CAF naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Azure CLI + Bicep
        run: |
          # az bicep install ensures the latest stable Bicep is available
          az bicep install
          az bicep version

      # Step 1: az bicep build — must exit 0 (per ADR-048 and standing feedback rule)
      - name: Bicep lint and build
        run: az bicep build --stdout --file iac/main.bicep

      # Also lint sub-modules individually so errors in them surface with accurate paths
      - name: Bicep lint — resources.bicep
        run: az bicep build --stdout --file iac/resources.bicep

      - name: Bicep lint — monitoring.bicep
        run: az bicep build --stdout --file iac/monitoring.bicep

      - name: Bicep lint — pg-aad-admin.bicep
        run: az bicep build --stdout --file iac/pg-aad-admin.bicep

      # Step 2: CAF naming check
      # Reads main.parameters.example.json and verifies that any non-empty name
      # overrides follow {abbr}-cloudsmith-{env}-{region}-{instance} pattern.
      # Empty override values are CAF-generated at deploy time — skip them.
      - name: CAF naming validation
        shell: pwsh
        run: |
          $params = Get-Content iac/main.parameters.example.json | ConvertFrom-Json
          $nameParams = @(
            'logAnalyticsName', 'applicationInsightsName', 'azureMonitorWorkspaceName',
            'managedIdentityName', 'keyVaultName', 'postgresServerName',
            'containerAppsEnvironmentName', 'apiAppName', 'portalAppName'
          )
          # CAF pattern: one or more lowercase alphanumeric/hyphen segments separated by hyphens
          # Must begin with a known abbreviation and contain 'cloudsmith' (or the workload value)
          $cafPattern = '^[a-z0-9]+-cloudsmith-[a-z0-9]+-[a-z0-9]+-[0-9]{3}$'
          $kvPattern   = '^kv[a-z0-9]{1,4}[a-z0-9]+-?[a-z0-9]{3}-?[a-z0-9]{3}[a-z0-9]{6}$'
          $failures = @()
          foreach ($paramName in $nameParams) {
            $paramValue = $params.parameters.$paramName.value
            if (-not $paramValue -or $paramValue -eq '') { continue }
            # Key Vault uses the length-constrained no-separator pattern
            $pattern = if ($paramName -eq 'keyVaultName') { $kvPattern } else { $cafPattern }
            if ($paramValue -notmatch $pattern) {
              $failures += "${paramName}: '${paramValue}' does not match CAF pattern"
            }
          }
          if ($failures.Count -gt 0) {
            Write-Error "CAF naming violations found:`n$($failures -join "`n")"
            exit 1
          }
          Write-Host "CAF naming check passed (all non-empty name overrides are compliant or empty)."

      # Step 3: Azure Policy compliance check
      # Full policy evaluation requires authenticated az login and a deployed RG.
      # In CI we validate that the policy definition IDs referenced in main.bicep
      # exist as built-in policies (az policy definition show).
      # A TODO comment marks where live compliance scanning should be wired once
      # a CI service principal is available.
      - name: Azure Policy definition IDs — existence check
        shell: pwsh
        run: |
          # TODO (AB#1668): Wire az deployment sub what-if + az policy compliance scan
          # once a CI service principal with Reader + Policy Reader roles is provisioned.
          # For now, emit the policy definition IDs that will be assigned so they are
          # visible in CI output and can be cross-referenced manually.
          # AB#2381 — policy ID 24fde369-2374-4b4c-a418-b4d97d0b0cef (PG infrastructure encryption)
          # removed: this definition does not exist in the Azure built-in policy catalog.
          # PG Flexible Server uses Microsoft-managed key encryption on by default;
          # CMK encryption is a Phase V enhancement (tracked separately).
          $policyIds = @(
            '5ff38825-c5d8-47c5-b70e-069a21955146',  # KV key expiry
            '55615ac9-af46-4a59-874e-391cc3dfb490',  # KV firewall
            'c9299215-ae47-4f50-9c54-8a392f68a052',  # PG public access
            '871b6d14-10aa-478d-b590-94f262ecfa99'   # Require tag on resources
          )
          Write-Host "Azure Policy definitions referenced in main.bicep:"
          $policyIds | ForEach-Object { Write-Host "  $_" }
          Write-Host "NOTE: Live policy compliance scan requires authenticated az login."
          Write-Host "      Add 'az policy assignment list' step once CI service principal is provisioned."
