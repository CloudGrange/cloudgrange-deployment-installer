name: Release Appliance
# Builds the CloudGrange Appliance VHDX on v*.*.* tag push (AB#1858).
# Requires a Windows self-hosted runner with Hyper-V enabled.
#
# The appliance is built by:
#   1. Running Install-CloudGrange.ps1 in Online mode to create a working cloudgrange-docker VM.
#   2. Calling Build-CloudGrangeAppliance.ps1 to export, compact, and sign the VHDX.
#   3. Attaching the VHDX + SHA-256 manifest + cosign signature to the GitHub Release.
#
# NOTE: GitHub-hosted runners do not support Hyper-V. A self-hosted Windows runner
# with Hyper-V enabled is required for this workflow (see docs/self-hosted-runner.md).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Appliance version (defaults to tag)'
        required: false
        default: ''
permissions:
  contents: write
  id-token: write
jobs:
  build-appliance:
    name: Build Appliance VHDX
    runs-on: [self-hosted, windows, hyper-v]
    timeout-minutes: 120
    env:
      APPLIANCE_OUTPUT: C:\CloudGrangeAppliance
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrEmpty($v)) {
            $v = '${{ github.ref_name }}'
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Appliance version: $v"

      - name: Run Online installer to build source VM
        shell: pwsh
        run: |
          .\Install-CloudGrange.ps1 -Mode Online -AcceptDefaults

      - name: Export and sign appliance VHDX
        shell: pwsh
        run: |
          .\Build-CloudGrangeAppliance.ps1 `
            -OutputPath '${{ env.APPLIANCE_OUTPUT }}' `
            -Version '${{ steps.version.outputs.version }}'

      - name: List appliance artifacts
        shell: pwsh
        run: |
          Get-ChildItem '${{ env.APPLIANCE_OUTPUT }}' | Format-Table Name, Length -AutoSize

      - name: Attach appliance to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APPLIANCE_OUTPUT }}/cloudgrange-appliance.vhdx
            ${{ env.APPLIANCE_OUTPUT }}/cloudgrange-appliance.vhdx.sha256
            ${{ env.APPLIANCE_OUTPUT }}/cloudgrange-appliance.vhdx.sig
            ${{ env.APPLIANCE_OUTPUT }}/cloudgrange-appliance.version
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false

      - name: Cleanup appliance build artifacts
        if: always()
        shell: pwsh
        run: |
          if (Test-Path '${{ env.APPLIANCE_OUTPUT }}') {
            Remove-Item '${{ env.APPLIANCE_OUTPUT }}' -Recurse -Force -ErrorAction SilentlyContinue
          }
          Stop-VM -Name cloudgrange-docker -Force -ErrorAction SilentlyContinue
          Remove-VM -Name cloudgrange-docker -Force -ErrorAction SilentlyContinue
