name: Release Appliance
# Builds the CloudGrange Appliance VHDX from a reproducible release bundle (AB#1858, AB#8129).
# On demand only: this is a documented Hyper-V HOST step (docs/releases/reproducible-build.md), never triggered
# by another workflow. It needs a self-hosted Windows runner with Hyper-V; GitHub-hosted runners cannot run it.
#
#   1. Download the Release Bundle run's artifact and check the zip against its recorded SHA-256
#      (release-record.json), which the bundle workflow rebuilt deterministically from one main commit.
#   2. Install-CloudGrange.ps1 -Mode Bundled -KeepInstallerSshKey creates the source VM.
#   3. Build-CloudGrangeAppliance.ps1 generalizes over SSH, exports, compacts and scans the VHDX for install-time
#      secrets (the build FAILS on any finding).
#   4. Upload the VHDX, its SHA-256 and the scan report as a workflow artifact. Nothing is attached to a release.
#
# The VHDX hash is recorded, not reproducible: see docs/releases/reproducible-build.md.
# The runner must have qemu-img (docs/prerequisites.md); -InstallPinnedQemu installs the pinned, SHA-512-verified
# build when it is missing.
on:
  workflow_dispatch:
    inputs:
      bundle_run_id:
        description: 'Run ID of the Release Bundle workflow whose artifact to build from'
        required: true
      version:
        description: 'Release version the bundle was built for (X.Y.Z[-pre])'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  build-appliance:
    name: Build Appliance VHDX
    runs-on: [self-hosted, windows, hyper-v]
    timeout-minutes: 180
    env:
      APPLIANCE_OUTPUT: C:\CloudGrangeAppliance
      BUNDLE_DIR: C:\CloudGrangeApplianceBundle
      VM_IP: 192.168.100.10
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate inputs
        shell: pwsh
        run: |
          if ('${{ inputs.version }}' -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'invalid version' }
          if ('${{ inputs.bundle_run_id }}' -notmatch '^\d+$') { throw 'invalid run id' }

      - name: Download and verify the release bundle
        id: bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '${{ env.BUNDLE_DIR }}' | Out-Null
          gh run download '${{ inputs.bundle_run_id }}' --repo '${{ github.repository }}' --dir '${{ env.BUNDLE_DIR }}' --name 'release-bundle-${{ inputs.version }}'
          $record = Get-Content (Join-Path '${{ env.BUNDLE_DIR }}' 'release-record.json') -Raw | ConvertFrom-Json
          if ($record.version -ne '${{ inputs.version }}') { throw "bundle version $($record.version) is not ${{ inputs.version }}" }
          $zip = Join-Path '${{ env.BUNDLE_DIR }}' 'Install-CloudGrange-Bundled.zip'
          $expected = $record.artifacts.'Install-CloudGrange-Bundled.zip'.sha256
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $expected.ToUpperInvariant()) { throw 'Bundle SHA-256 mismatch' }
          if ($record.sourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'release-record.json has no source commit' }
          "commit=$($record.sourceCommit)" >> $env:GITHUB_OUTPUT
          "source commit: $($record.sourceCommit)  bundle sha256: $expected"
          Expand-Archive -Path $zip -DestinationPath (Join-Path '${{ env.BUNDLE_DIR }}' 'bundle') -Force

      - name: Install source VM from the bundle (Bundled mode)
        shell: pwsh
        run: |
          $bundle = Join-Path '${{ env.BUNDLE_DIR }}' 'bundle'
          & (Join-Path $bundle 'Install-CloudGrange.ps1') -Mode Bundled -BundlePath $bundle -VmIp '${{ env.VM_IP }}' `
            -Version '${{ inputs.version }}' -AcceptDefaults -InstallPinnedQemu -KeepInstallerSshKey

      # Build and generalize with the same commit the bundle was built from, not the dispatching branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.bundle.outputs.commit }}
          path: src

      - name: Generalize, export and secret-scan the appliance VHDX
        shell: pwsh
        run: |
          $key = Join-Path $env:TEMP 'cloudgrange-install-key\installer_ed25519'
          try {
            .\src\Build-CloudGrangeAppliance.ps1 `
              -OutputPath '${{ env.APPLIANCE_OUTPUT }}' `
              -Version '${{ inputs.version }}' `
              -SshKeyPath $key -VmIp '${{ env.VM_IP }}'
          } finally {
            Remove-Item -Recurse -Force (Split-Path $key) -ErrorAction SilentlyContinue
          }

      - name: Record the appliance SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash '${{ env.APPLIANCE_OUTPUT }}\cloudgrange-appliance.vhdx' -Algorithm SHA256).Hash
          "cloudgrange-appliance.vhdx sha256 $h (recorded, not reproducible)" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          Get-ChildItem '${{ env.APPLIANCE_OUTPUT }}' | Format-Table Name, Length -AutoSize

      - name: Upload appliance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-appliance-${{ inputs.version }}
          if-no-files-found: error
          path: |
            ${{ env.APPLIANCE_OUTPUT }}/cloudgrange-appliance.vhdx
            ${{ env.APPLIANCE_OUTPUT }}/cloudgrange-appliance.vhdx.sha256
            ${{ env.APPLIANCE_OUTPUT }}/cloudgrange-appliance.version
            ${{ env.APPLIANCE_OUTPUT }}/cloudgrange-appliance.secret-scan.txt

      - name: Cleanup appliance build artifacts
        if: always()
        shell: pwsh
        run: |
          foreach ($p in '${{ env.APPLIANCE_OUTPUT }}', '${{ env.BUNDLE_DIR }}') {
            if (Test-Path $p) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Remove-Item -Recurse -Force (Join-Path $env:TEMP 'cloudgrange-install-key') -ErrorAction SilentlyContinue
          Stop-VM -Name cloudgrange-docker -TurnOff -Force -ErrorAction SilentlyContinue
          Remove-VM -Name cloudgrange-docker -Force -ErrorAction SilentlyContinue
