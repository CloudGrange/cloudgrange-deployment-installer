name: AVM Version Update Check
# AB#1669 — Weekly check for newer AVM module versions
# Compares pinned versions in iac/ Bicep files against the MCR registry.
# Opens a GitHub Issue listing outdated modules when newer versions are available.
on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  avm-update-check:
    name: Check AVM module versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AVM module versions and open issue if outdated
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Scan all .bicep files under iac/ for AVM module references of the form:
          #   br/public:avm/res/<path>:<version>
          # or
          #   br:mcr.microsoft.com/bicep/avm/res/<path>:<version>
          #
          # For each pinned reference, query the MCR registry tags API to find the
          # latest published version. If the pinned version is not the latest, flag it.

          $bicepFiles = Get-ChildItem -Path iac -Filter '*.bicep' -Recurse
          $avmRefs = @()

          foreach ($file in $bicepFiles) {
            $content = Get-Content $file.FullName -Raw
            # Match: br/public:avm/res/<module-path>:<version>
            $matches = [regex]::Matches($content, "br/public:avm/res/([a-z0-9\-/]+):([0-9]+\.[0-9]+\.[0-9]+)")
            foreach ($m in $matches) {
              $avmRefs += [PSCustomObject]@{
                File    = $file.Name
                Module  = "avm/res/$($m.Groups[1].Value)"
                Pinned  = $m.Groups[2].Value
              }
            }
          }

          if ($avmRefs.Count -eq 0) {
            Write-Host "No AVM module references found in iac/ Bicep files."
            Write-Host "NOTE: AVM adoption is tracked under AB#1667. Once AVM modules are wired,"
            Write-Host "      this job will automatically detect version drift."
            exit 0
          }

          Write-Host "Found $($avmRefs.Count) AVM module reference(s):"
          $avmRefs | Format-Table -AutoSize

          # Query MCR for the latest tag for each unique module path.
          # MCR tags API: https://mcr.microsoft.com/v2/bicep/<module-path>/tags/list
          $outdated = @()

          foreach ($ref in ($avmRefs | Select-Object -Unique Module, Pinned)) {
            $apiUrl = "https://mcr.microsoft.com/v2/bicep/$($ref.Module)/tags/list"
            try {
              $response = Invoke-RestMethod -Uri $apiUrl -TimeoutSec 30
              # Tags are semver strings; pick the highest using version sorting
              $latestTag = $response.tags |
                Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
                Sort-Object { [version]$_ } -Descending |
                Select-Object -First 1

              if ($null -eq $latestTag) {
                Write-Warning "No semver tags found for $($ref.Module) — skipping."
                continue
              }

              if ([version]$latestTag -gt [version]$ref.Pinned) {
                $outdated += [PSCustomObject]@{
                  Module  = $ref.Module
                  Pinned  = $ref.Pinned
                  Latest  = $latestTag
                }
                Write-Host "OUTDATED: $($ref.Module) pinned=$($ref.Pinned) latest=$latestTag"
              } else {
                Write-Host "OK: $($ref.Module) pinned=$($ref.Pinned) latest=$latestTag"
              }
            } catch {
              Write-Warning "Could not query MCR for $($ref.Module): $_"
            }
          }

          if ($outdated.Count -eq 0) {
            Write-Host "All AVM modules are up to date."
            exit 0
          }

          # Build issue body
          $rows = $outdated | ForEach-Object { "| ``$($_.Module)`` | $($_.Pinned) | $($_.Latest) |" }
          $body = @"
          ## AVM module version drift detected

          The following Azure Verified Modules referenced in ``iac/`` have newer versions available in the MCR registry.

          | Module | Pinned version | Latest version |
          |--------|---------------|----------------|
          $($rows -join "`n")

          ### Action required

          Update the pinned version strings in the relevant ``.bicep`` files and run ``az bicep build --stdout iac/main.bicep`` (must exit 0) before merging.

          Per ADR-048: AVM module upgrades must be validated against a fresh ``rg-cg-test-{suffix}`` resource group before merging to main. Never test AVM upgrades against ``rg-cloudgrange-dev-cus-001``.

          _This issue was auto-generated by the [AVM Version Update Check workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._
          "@

          # Open (or update) a GitHub Issue
          $existing = gh issue list --label "avm-update" --state open --json number,title | ConvertFrom-Json
          if ($existing.Count -gt 0) {
            $issueNumber = $existing[0].number
            gh issue comment $issueNumber --body $body
            Write-Host "Updated existing AVM update issue #$issueNumber"
          } else {
            gh issue create `
              --title "AVM module versions outdated — update required" `
              --body $body `
              --label "avm-update,dependencies"
            Write-Host "Opened new AVM update issue."
          }
