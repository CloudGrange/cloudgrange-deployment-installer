name: Release Bundle
# Rebuilds the air-gap bundle Install-CloudGrange-K3s-Bundled.zip from ONE commit on main,
# reproducibly (AB#1586, AB#1587, AB#8129, AB#9184, AB#9189). On demand only, on the self-hosted
# HCS Linux runner. No tag push trigger, no GitHub release: the zip, its SHA-256 and
# release-record-k3s.json are uploaded as a workflow artifact and the SHA-256 is written to the
# run summary. Rebuilding the same commit and version gives the same SHA-256
# (docs/releases/reproducible-build.md).
#
# AB#9189: the Compose bundle (Install-CloudGrange-Bundled.zip, scripts/New-ReleaseBundle.sh) is
# RETIRED and no longer built here. K3s/Helm is the only shipping engine, and the K3s bundle now
# carries the pinned K3s binary, K3s's airgap image tarball and every image the rendered chart
# references, so it has the offline parity the Compose bundle used to be kept around for.
#
# Inputs are pinned in the repo under release/: the K3s version in release/k3s-version.txt
# (checked against K3s's own published sha256sum-amd64.txt at build time), first-party images by
# the --version tag, vendor images by the digests/tags the chart itself renders.
# The bundle is NOT signed: SHA256SUMS is an integrity check only, not an authenticity check.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full 40-character commit SHA on main to build from'
        required: true
      version:
        description: 'Release version (X.Y.Z[-pre]); the first-party images must exist at this tag'
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: release-bundle-${{ inputs.commit_sha }}
  cancel-in-progress: false
jobs:
  build-bundle:
    runs-on: [self-hosted, linux, x64, hcs]
    timeout-minutes: 90
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}
      CLOUDGRANGE_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "commit_sha must be a full 40-character SHA"; exit 1; }
          [[ "$CLOUDGRANGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "invalid version"; exit 1; }
          for t in docker zip python3 pwsh curl sha256sum helm tar; do command -v "$t" >/dev/null || { echo "runner is missing $t"; exit 1; }; done
          python3 -c 'import yaml' || { echo "runner is missing python3-yaml"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require the commit to be on main and export exactly that tree
        run: |
          git cat-file -e "$COMMIT_SHA^{commit}"
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main || { echo "$COMMIT_SHA is not on origin/main"; exit 1; }
          rm -rf "$RUNNER_TEMP/src" && mkdir -p "$RUNNER_TEMP/src"
          git archive --format=tar "$COMMIT_SHA" | tar -x -C "$RUNNER_TEMP/src"
          echo "tree: $(git rev-parse "$COMMIT_SHA^{tree}")"

      - name: Gate tests on the exported tree (fail, never skip)
        working-directory: ${{ runner.temp }}/src
        run: |
          test -z "${CLOUDGRANGE_TEST_ALLOW_SKIP:-}"
          sudo -E python3 -m unittest discover -v -s test/appliance -p 'test_install_scripts.py'
          # AB#9182's interrupt/resume and uninstall-retention qualification gates.
          python3 -m unittest discover -v -s test/appliance -p 'test_install_qualification.py'
          # AB#9170 install-mode parity: stops a capability being added to one engine only.
          python3 -m unittest discover -v -s test/appliance -p 'test_engine_parity.py'
          # Kept after the Compose BUNDLE's retirement: this gate covers the compose/ engine
          # content (container hardening, image pins, nginx config), which still ships. It is
          # not a bundle-build test, so retiring the bundle is no reason to drop it.
          python3 -m unittest discover -v -s test/appliance -p 'test_compose_gates.py'
          python3 scripts/Test-SshTransportOptions.py .
          python3 -m unittest discover -v -s test/appliance -p 'test_ssh_transport.py'
          sudo -E python3 -m unittest discover -v -s test/appliance -p 'test_kvp_writer.py'
          sudo -E python3 -m unittest discover -v -s test/appliance -p 'test_operator_access.py'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the K3s bundle (deterministic, offline-capable)
        run: |
          bash "$RUNNER_TEMP/src/scripts/New-ReleaseBundleK3s.sh" --source "$RUNNER_TEMP/src" \
            --version "$CLOUDGRANGE_VERSION" --images registry --out "$RUNNER_TEMP/out"

      - name: Record SHA-256
        run: |
          {
            echo "### Install-CloudGrange-K3s-Bundled.zip"
            echo "- commit: \`$COMMIT_SHA\`"
            echo "- version: \`$CLOUDGRANGE_VERSION\`"
            echo "- sha256: \`$(cut -d' ' -f1 "$RUNNER_TEMP/out/Install-CloudGrange-K3s-Bundled.zip.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/out/release-record-k3s.json"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-k3s-${{ inputs.version }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/out/Install-CloudGrange-K3s-Bundled.zip
            ${{ runner.temp }}/out/Install-CloudGrange-K3s-Bundled.zip.sha256
            ${{ runner.temp }}/out/release-record-k3s.json
