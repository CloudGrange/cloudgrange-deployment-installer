name: Release Bundle
# Builds the air-gap bundled distribution ZIP on v*.*.* tag push (AB#1586, AB#1587, AB#8129).
# The bundle contains every image in compose/docker-compose.yml saved to one
# cloudgrange-images.tar (the file Install-CloudGrange.ps1 -Mode Bundled loads), the compose
# files, the systemd unit, and Install-CloudGrange.ps1. The image list is read from the compose
# file, which is the source of truth for the service list.
# The bundle is NOT signed: SHA256SUMS is an integrity check only, not an authenticity check.
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
  packages: read
jobs:
  build-bundle:
    runs-on: ubuntu-latest
    env:
      CLOUDGRANGE_VERSION: latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image list from compose
        run: |
          { docker compose -f compose/docker-compose.yml config --images; grep -v '^\s*$' compose/helper-images.txt; } | sort -u > images.txt
          echo "Images:"; cat images.txt
          # AB#8129: every vendor image must be digest-pinned.
          if grep -v '^ghcr.io/cloudgrange/' images.txt | grep -vq '@sha256:'; then echo "Unpinned vendor image"; exit 1; fi

      - name: Pull container images
        run: |
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            echo "Pulling $image..."
            docker pull "$image"
          done < images.txt

      - name: Save container images to one tar
        run: |
          mkdir -p bundle
          xargs -a images.txt docker save -o bundle/cloudgrange-images.tar
          cp images.txt bundle/images.txt

      - name: Copy installer files into bundle
        run: |
          cp Install-CloudGrange.ps1   bundle/
          cp verify-bundle.ps1        bundle/
          cp New-SelfSignedCert.ps1   bundle/
          cp Uninstall-CloudGrange.ps1 bundle/ 2>/dev/null || true
          cp Update-CloudGrange.ps1    bundle/ 2>/dev/null || true
          cp -r scripts/              bundle/scripts/
          cp -r compose/              bundle/compose/
          mkdir -p bundle/docs && cp docs/prerequisites.md docs/product-installer-design.md bundle/docs/
          # Install-CloudGrange.ps1 refuses to run without this integrity file beside it.
          sha256sum Install-CloudGrange.ps1 | awk '{print toupper($1)"  Install-CloudGrange.ps1"}' > bundle/cloudgrange-installer.sha256

      - name: Add verified Ubuntu noble cloud image (required by -Mode Bundled)
        run: |
          base=https://cloud-images.ubuntu.com/noble/current
          curl -fsSL "$base/SHA256SUMS" -o ubuntu-SHA256SUMS
          curl -fsSL "$base/noble-server-cloudimg-amd64.img" -o noble-server-cloudimg-amd64.img
          grep ' \*\?noble-server-cloudimg-amd64.img$' ubuntu-SHA256SUMS | sha256sum -c
          mv noble-server-cloudimg-amd64.img bundle/ubuntu-24.04-cloudimg.img

      - name: Add pinned Docker CE packages for offline Bundled installs (AB#8129)
        run: |
          # Exact versions; the apt repo key fingerprint is checked before use.
          docker run --rm -v "$PWD/bundle:/out" ubuntu@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254 bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg >/dev/null
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            gpg --show-keys --with-colons /etc/apt/keyrings/docker.asc | grep -q "^fpr:::::::::9DC858229FC7DD38854AE2D88D81803C0EBFCD88:"
            echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
            apt-get update -qq
            mkdir -p /out/docker-debs/debs
            apt-get install -y -qq --download-only --no-install-recommends \
              docker-ce=5:29.8.0-1~ubuntu.24.04~noble docker-ce-cli=5:29.8.0-1~ubuntu.24.04~noble \
              containerd.io=2.3.5-1~ubuntu.24.04~noble docker-buildx-plugin=0.37.1-1~ubuntu.24.04~noble \
              docker-compose-plugin=5.5.1-1~ubuntu.24.04~noble jq=1.7.1-3ubuntu0.24.04.2 >/dev/null
            cp /var/cache/apt/archives/*.deb /out/docker-debs/debs/
            printf "%s\n" docker-ce=5:29.8.0-1~ubuntu.24.04~noble docker-ce-cli=5:29.8.0-1~ubuntu.24.04~noble containerd.io=2.3.5-1~ubuntu.24.04~noble docker-buildx-plugin=0.37.1-1~ubuntu.24.04~noble docker-compose-plugin=5.5.1-1~ubuntu.24.04~noble jq=1.7.1-3ubuntu0.24.04.2 > /out/docker-debs/versions.txt
          '
          (cd bundle/docker-debs/debs && sha256sum *.deb > ../SHA256SUMS)

      - name: Generate SHA-256 manifest
        run: |
          cd bundle
          # Generate SHA256SUMS relative to the bundle root. Exclude the manifest itself: the
          # redirect creates it before find runs, so it would list a hash of a partial file.
          find . -type f ! -name SHA256SUMS | sort | while read -r f; do
            sha256sum "$f" | sed 's|  \./|  |'
          done > SHA256SUMS
          echo "SHA256SUMS generated:"
          cat SHA256SUMS

      - name: Create bundle ZIP
        run: |
          ZIP_NAME="Install-CloudGrange-Bundled.zip"
          cd bundle
          zip -r "../${ZIP_NAME}" .
          cd ..
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
          echo "Bundle: ${ZIP_NAME} ($(du -sh "${ZIP_NAME}" | cut -f1))"
          echo "SHA256: $(cat "${ZIP_NAME}.sha256")"

      - name: Verify bundle integrity
        run: |
          pwsh -Command ".\verify-bundle.ps1 -BundlePath 'Install-CloudGrange-Bundled.zip'"
        continue-on-error: false

      - name: Attach bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Install-CloudGrange-Bundled.zip
            Install-CloudGrange-Bundled.zip.sha256
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
