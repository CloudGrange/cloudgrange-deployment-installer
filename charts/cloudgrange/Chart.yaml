apiVersion: v2
name: cloudgrange
description: CloudGrange platform — umbrella chart (AB#9171)
type: application
# AB#9171 (plan B2): the chart IS the platform, so the chart carries the platform version
# (YYMM.MINOR.PATCH, pmo/decisions-2026-09-15/release-versioning.md) in both fields. A release
# stamps the real value into this file and into the api/portal/relay subcharts' appVersion with
# scripts/release/Set-ChartVersion.sh. appVersion is also the default first-party image tag.
version: 2609.0.0
appVersion: "2609.0.0"
# AB#9171 (plan B3/E5): the Kubernetes versions this platform release supports. Helm refuses to
# install or upgrade onto a cluster outside the range, and the in-cluster Platform updater refuses
# an update whose target chart excludes the running cluster. The API reports it to the portal as
# CLOUDGRANGE_SUPPORTED_KUBE_RANGE (templates/platform-env-configmap.yaml).
#   - lower bound 1.33: the oldest minor AKS still supports (GA until Jul 2026, LTS to Jul 2027);
#   - upper bound below 1.38: 1.37 is the newest AKS GA minor; nothing newer is qualified;
#   - the pinned managed-foundation K3s, v1.36.4+k3s1 (release/pins.conf), sits inside it.
# The "-0" suffixes make pre-release/build-suffixed server versions (v1.36.4+k3s1, AKS, EKS
# "-eks-…") compare as their base version instead of being excluded by SemVer pre-release rules.
kubeVersion: ">=1.33.0-0 <1.38.0-0"
icon: https://cloudgrange.com/favicon.svg
# Subcharts are plain subdirectories under charts/ (api, portal, relay, postgres,
# keycloak, observability). Declared below purely so `helm lint` doesn't flag them as
# "missing" — Helm resolves them from the subdirectories directly; no `helm dependency
# build`/`update` step or network access is needed (nothing is pulled from a repository).
dependencies:
  - { name: api,           version: 0.1.0 }
  - { name: portal,        version: 0.1.0 }
  - { name: relay,         version: 0.1.0 }
  - { name: postgres,      version: 0.1.0 }
  - { name: keycloak,      version: 0.1.0 }
  - { name: observability, version: 0.1.0 }
  - { name: redis,         version: 0.1.0 }
# AB#9179: cert-manager is deliberately NOT a dependency here, even though it's bundled
# (see charts/cert-manager-v1.21.2.tgz, a sibling of this directory). A real k3d install
# proved Helm can't validate CRD-typed resources (our own ClusterIssuer/Certificate below)
# in the SAME install as a subchart that introduces those CRDs — "no matches for kind
# ClusterIssuer in version cert-manager.io/v1, ensure CRDs are installed first" — Helm
# builds every object from the whole combined release manifest before applying any of it,
# so a subchart's CRDs aren't registered with the API server yet when our own templates
# are validated. This is cert-manager's own documented, standard pattern for every chart
# that depends on it: install cert-manager as its own separate Helm release FIRST, then
# install charts (like this one) that use its CRDs. See README.md's install sequence.
# AB#9190: CloudNativePG (charts/vendor/cloudnative-pg-0.29.0.tgz), AB#9191: MetalLB
# (charts/vendor/metallb-0.16.1.tgz), and AB#9192: Velero (charts/vendor/velero-12.2.0.tgz)
# are NOT dependencies here for the exact same reason — each ships its own CRDs (Cluster/
# ScheduledBackup, IPAddressPool/L2Advertisement, Backup/Restore/Schedule respectively)
# that our own templates (postgres/templates/cluster.yaml, templates/metallb.yaml,
# templates/velero-schedule.yaml) reference. Same fix, applied proactively each time:
# separate release, installed first.
