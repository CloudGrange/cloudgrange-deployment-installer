{{- /* AB#9178: RBAC for the bootstrap-secrets hook Job below. Must be hook resources
too, at an earlier (more negative) weight than the Job — Helm runs every pre-install
hook before any normal chart resource, so if these weren't hooks themselves the Job's
pod would have no ServiceAccount to be admitted with (the same ordering mistake AB#9177
found and removed for the old migration hook Job, this time applied correctly since
there's no cross-resource app dependency here, only RBAC objects this chart fully owns). */ -}}
{{- /* AB#9187: the Job these RBAC objects support is skipped entirely on AKS (see
secrets-bootstrap-job.yaml) — no point creating a ServiceAccount/Role/RoleBinding for a
Job that won't run there. */ -}}
{{- if not .Values.global.aks.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-secrets-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-secrets-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # get+create only, never update/patch/delete — the whole point is "write once if
  # absent," never overwrite an existing bootstrap secret.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Release.Name }}-secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-secrets-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-secrets-bootstrap
roleRef:
  kind: Role
  name: {{ .Release.Name }}-secrets-bootstrap
  apiGroup: rbac.authorization.k8s.io
{{- end }}
