{{- /*
AB#9177: placeholder Secret populated from --set/values at install time. This is
explicitly temporary — AB#9178 replaces it with an idempotent pre-install hook Job that
generates these values server-side (via the Kubernetes API) if they don't already exist,
the same way New-SelfSignedCert.ps1/Install-CloudGrange-Linux.sh generate the Compose
stack's .env today. Do not commit real secret values into any values file.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/part-of: cloudgrange
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  keycloak-admin-user: {{ .Values.secrets.keycloakAdminUser | quote }}
  keycloak-admin-password: {{ .Values.secrets.keycloakAdminPassword | quote }}
  keycloak-api-client-secret: {{ .Values.secrets.keycloakApiClientSecret | quote }}
  grafana-admin-password: {{ .Values.secrets.grafanaAdminPassword | quote }}
  relay-enrollment-token: {{ .Values.secrets.relayEnrollmentToken | quote }}
  realm-admin-password: {{ .Values.secrets.realmAdminPassword | quote }}
