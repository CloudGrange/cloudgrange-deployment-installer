{{- /* AB#9178: replaces the .env-file-with-mode-0600 pattern (New-SelfSignedCert.ps1 /
Install-CloudGrange-Linux.sh generate a .env today) with a Kubernetes-native equivalent:
generate the 6 bootstrap secrets idempotently, via the Kubernetes API, only if the Secret
doesn't already exist — so `helm upgrade` never regenerates/rotates values a running
install already depends on. RBAC-scoped and encrypted-at-rest via the cluster's own etcd
encryption provider, a strict improvement over a plaintext 0600 file. */ -}}
{{- /* AB#9187 real bug, found via a real AKS test: this Job is a pre-install hook, which
always runs FIRST regardless of engine — on AKS it was creating `{{ .Release.Name
}}-secrets` with RANDOM values before the CSI SecretProviderClass's secretObjects sync
(which targets the exact same Secret name) ever got a chance to run, since that sync only
fires when a pod actually mounts the CSI volume. The bootstrap Job's idempotent
"only if absent" check meant it always won the race and silently shadowed the real
customer-supplied Key Vault values with random ones — completely defeating the point of
AB#9187's Key Vault integration; confirmed for real, the Secret in the cluster held random
bootstrap values, not the test values written to Key Vault. Fix: skip this Job entirely
when global.aks.enabled — the CSI sync is the sole source of this Secret on AKS. */ -}}
{{- /* AB#9171 (owner rule: the platform provisions, not the user): on AKS this Job now runs too,
exactly as on-prem, unless the customer explicitly opts into Key Vault-sourced secrets with
global.aks.keyVaultSecrets=true; only then is the CSI sync the source and this Job skipped. */ -}}
{{- if not (and .Values.global.aks.enabled .Values.global.aks.keyVaultSecrets) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-secrets-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-secrets-bootstrap
      restartPolicy: Never
      securityContext: {{- include "cloudgrange.podSecurity" (dict "uid" 65534) | nindent 8 }}
      containers:
        - name: bootstrap
          image: {{ include "cloudgrange.image" (dict "ref" .Values.secretsBootstrap.image "global" .Values.global) | quote }}
          securityContext: {{- include "cloudgrange.containerSecurity" . | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              NS="$POD_NAMESPACE"
              NAME="{{ .Release.Name }}-secrets"
              if kubectl get secret "$NAME" -n "$NS" >/dev/null 2>&1; then
                echo "Secret $NAME already exists — leaving it alone (idempotent, AB#9178)."
                exit 0
              fi
              echo "Secret $NAME not found — generating bootstrap values."
              rand() { head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 32; }
              PG_PASSWORD="$(rand)"
              kubectl create secret generic "$NAME" -n "$NS" \
                --from-literal=postgres-password="$PG_PASSWORD" \
                --from-literal=keycloak-admin-user="admin" \
                --from-literal=keycloak-admin-password="$(rand)" \
                --from-literal=keycloak-api-client-secret="$(rand)" \
                --from-literal=grafana-admin-password="$(rand)" \
                --from-literal=relay-enrollment-token="$(rand)" \
                --from-literal=realm-admin-password="$(rand)" \
                --from-literal=username="cloudgrange" \
                --from-literal=password="$PG_PASSWORD"
              # AB#9190: `username`/`password` are duplicates of `postgres-password` under
              # the fixed key names CloudNativePG's Cluster.spec.bootstrap.initdb.secret
              # requires (multi-node/ha profile only) — same value, same Secret object,
              # so every existing on-prem consumer of postgres-password is unaffected.
              echo "Secret $NAME created."
          env:
            - name: HOME   # kubectl's discovery cache; the non-root user has no home
              value: /tmp
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
{{- end }}
