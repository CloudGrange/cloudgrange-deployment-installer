{{- /* AB#9180: K3s ships Traefik as its default ingress controller — nothing to install,
just route to it. Mirrors the Compose edge nginx's own routing exactly: everything goes
to the portal (which internally reverse-proxies /api/, /hubs/, /health/, /signin-oidc to
the API — CLOUDGRANGE_API_UPSTREAM in the portal Deployment, AB#9177), except the large
release-bundle upload route, sent straight to the API so a multi-GB upload isn't buffered
through the portal (same special case the edge nginx.conf carves out). No LAN-agent 8443
route here — the relay's own LoadBalancer Service (AB#9177) already exposes that directly,
Traefik was never in that path even in Compose (a separate nginx server block on 8443). */ -}}
{{- /* AB#9183 real bug, found via a real Windows-orchestrated -> Hyper-V VM install: an
Ingress `spec.rules[].host` MUST be a DNS name — Kubernetes flat-out rejects an IP address
there ("must be a DNS name, not an IP address"). Install-CloudGrange.ps1's own default flow
passes the VM's IP as the hostname (no real DNS name exists yet at install time on-prem, a
completely normal case, not an edge case) — every real install using that default failed
this exact way. Fix: omit `host` entirely (an empty/absent host matches ALL incoming Host
headers) when global.hostname isn't a DNS name, so IP-based access keeps working; a real
DNS hostname still gets the more specific host-matched rule. */ -}}
{{- $isIp := regexMatch `^[0-9]{1,3}(\.[0-9]{1,3}){3}$` .Values.global.hostname }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    # Traefik's default backend timeout (90s) matches the edge nginx's proxy_read_timeout
    # for the portal route; the large-upload path below needs much longer.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Values.global.hostname | quote }}]
      secretName: {{ .Release.Name }}-tls
  rules:
    - {{- if not $isIp }}
      host: {{ .Values.global.hostname | quote }}
      {{- end }}
      http:
        paths:
          - path: /api/v1/platform/update/upload
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-api
                port: { number: 8080 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-portal
                port: { number: 8080 }
