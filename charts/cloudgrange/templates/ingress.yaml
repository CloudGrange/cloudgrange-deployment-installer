{{- /* AB#9180: K3s ships Traefik as its default ingress controller — nothing to install,
just route to it. Mirrors the Compose edge nginx's own routing exactly: everything goes
to the portal (which internally reverse-proxies /api/, /hubs/, /health/, /signin-oidc to
the API — CLOUDGRANGE_API_UPSTREAM in the portal Deployment, AB#9177), except the large
release-bundle upload route, sent straight to the API so a multi-GB upload isn't buffered
through the portal (same special case the edge nginx.conf carves out). No LAN-agent 8443
route here — the relay's own LoadBalancer Service (AB#9177) already exposes that directly,
Traefik was never in that path even in Compose (a separate nginx server block on 8443). */ -}}
{{- /* AB#9183 real bug, found via a real Windows-orchestrated -> Hyper-V VM install: an
Ingress `spec.rules[].host` MUST be a DNS name — Kubernetes flat-out rejects an IP address
there ("must be a DNS name, not an IP address"). Install-CloudGrange.ps1's own default flow
passes the VM's IP as the hostname (no real DNS name exists yet at install time on-prem, a
completely normal case, not an edge case) — every real install using that default failed
this exact way. Fix: omit `host` entirely (an empty/absent host matches ALL incoming Host
headers) when global.hostname isn't a DNS name, so IP-based access keeps working; a real
DNS hostname still gets the more specific host-matched rule. */ -}}
{{- $isIp := regexMatch `^[0-9]{1,3}(\.[0-9]{1,3}){3}$` .Values.global.hostname }}
{{- /* The ingress class MUST be configurable. This chart is meant to install on ANY
conformant Kubernetes — microk8s, EKS, AKS, an existing cluster the customer already runs —
not only on K3s. It previously hardcoded `ingressClassName: traefik` plus Traefik-only
annotations, so on any cluster whose controller is nginx/public/azure/alb the Ingress was
simply never claimed by a controller and the product was unreachable, with no error to
explain it. `global.ingress.className` defaults to traefik (K3s's built-in, which the
bundled single-node install uses) and is overridden with
`--set global.ingress.className=public` (microk8s), `nginx`, `azure/application-gateway`,
etc. Controller-specific annotations come from `global.ingress.annotations` so they are
never imposed on a controller that does not understand them. */ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  {{- $ann := deepCopy (.Values.global.ingress.annotations | default dict) }}
  {{- if and .Values.global.aks.enabled .Values.global.aks.tlsCertificateUri }}
  {{- /* AB#9171: AKS application routing add-on — it syncs this Key Vault certificate into Secret
  "keyvault-<ingress name>", which values-azure.yaml points the tls secretName at. */}}
  {{- $_ := set $ann "kubernetes.azure.com/tls-cert-keyvault-uri" .Values.global.aks.tlsCertificateUri }}
  {{- end }}
  {{- if $ann }}
  annotations:
    {{- toYaml $ann | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.global.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.global.hostname | quote }}]
      secretName: {{ tpl (.Values.global.ingress.tls.secretName | default "") . | default (printf "%s-tls" .Release.Name) | quote }}
  rules:
    - {{- if not $isIp }}
      host: {{ .Values.global.hostname | quote }}
      {{- end }}
      http:
        paths:
          - path: /api/v1/platform/update/upload
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-api
                port: { number: 8080 }
          {{- /* AB#9171 (UAT: `cg auth login` got the portal SPA from /realms): the platform realm's
          OIDC endpoints (discovery, device authorization, token, the device-verification and
          login pages) are served on the platform host over this Ingress's TLS, exactly like the
          Compose edge nginx: ONLY /realms/cloudgrange — the master realm and /admin are never
          published. Keycloak's static theme assets live under /resources/<resource version>/;
          plain /resources is a portal route (Resources blade), so only the exact version
          segment of the pinned Keycloak image is routed (keycloak.resourcesVersion). */}}
          - path: /realms/cloudgrange
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-keycloak
                port: { number: 8080 }
          {{- with .Values.keycloak.resourcesVersion }}
          - path: /resources/{{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-keycloak
                port: { number: 8080 }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-portal
                port: { number: 8080 }
