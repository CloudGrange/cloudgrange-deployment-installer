{{- /* AB#9187 fix: the other required half of Azure AD Workload Identity, paired with
the azure.workload.identity/use pod label (charts/api/templates/deployment.yaml) and a
federated identity credential on the UAMI (subject
system:serviceaccount:<namespace>:<this-name>, issuer = the AKS cluster's OIDC issuer
URL) — created at cluster-setup time (az identity federated-credential create), not by
this chart, since it needs the OIDC issuer URL which only exists once the real AKS
cluster does. Found missing entirely via a real AKS test: the SecretProviderClass set
clientID but nothing on the pod side actually established a federated identity to use it
with. */ -}}
{{- if .Values.global.aks.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-workload-identity
  annotations:
    azure.workload.identity/client-id: {{ .Values.global.aks.managedIdentityClientId | quote }}
{{- end }}
