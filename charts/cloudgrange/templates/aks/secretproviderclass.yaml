{{- /* AB#9187: AKS-only. Requires the Secrets Store CSI Driver + Azure Key Vault
provider AKS add-on already enabled on the cluster (not provisioned by this chart —
Azure resource creation is a confirm-first action, out of scope for a Helm chart).
`secretObjects` syncs the Key Vault values into a REGULAR Kubernetes Secret named
identically to AB#9178's bootstrap Secret, so every subchart's existing secretKeyRef
references keep working completely unchanged on AKS — this is the only AKS-specific
resource needed. */ -}}
{{- if .Values.global.aks.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-azure-kv
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Release.Name }}-secrets
      type: Opaque
      data:
        - objectName: postgres-password
          key: postgres-password
        - objectName: keycloak-admin-user
          key: keycloak-admin-user
        - objectName: keycloak-admin-password
          key: keycloak-admin-password
        - objectName: keycloak-api-client-secret
          key: keycloak-api-client-secret
        - objectName: grafana-admin-password
          key: grafana-admin-password
        - objectName: relay-enrollment-token
          key: relay-enrollment-token
        - objectName: realm-admin-password
          key: realm-admin-password
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.global.aks.managedIdentityClientId | quote }}
    keyvaultName: {{ .Values.global.aks.keyVaultName | quote }}
    tenantId: {{ .Values.global.aks.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: keycloak-admin-user
          objectType: secret
        - |
          objectName: keycloak-admin-password
          objectType: secret
        - |
          objectName: keycloak-api-client-secret
          objectType: secret
        - |
          objectName: grafana-admin-password
          objectType: secret
        - |
          objectName: relay-enrollment-token
          objectType: secret
        - |
          objectName: realm-admin-password
          objectType: secret
{{- end }}
