{{- /* AB#9179: replaces the install-time OpenSSL self-signed cert generation
(New-SelfSignedCert.ps1 / Install-CloudGrange-Linux.sh) with cert-manager. Default issuer
is self-signed, matching today's behavior exactly — customers upgrade to ACME/Let's
Encrypt or their own CA by pointing Values.certManager.issuer at a different ClusterIssuer,
without any chart changes. */ -}}
{{- /* AB#9171: and only when the cluster serves cert-manager.io/v1 — otherwise the install fails outright. */ -}}
{{- if and .Values.certManager.installOperator (.Capabilities.APIVersions.Has "cert-manager.io/v1") }}
{{- $issuer := .Values.certManager.issuerRef | default dict }}
{{- if not $issuer.name }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Release.Name }}-selfsigned
spec:
  selfSigned: {}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-tls
spec:
  secretName: {{ .Release.Name }}-tls
  issuerRef:
    {{- if $issuer.name }}
    # AB#9171: the customer's own issuer (certManager.issuerRef).
    name: {{ $issuer.name | quote }}
    kind: {{ $issuer.kind | default "ClusterIssuer" | quote }}
    {{- else }}
    name: {{ .Release.Name }}-selfsigned
    kind: ClusterIssuer
    {{- end }}
  {{- /* AB#9171: an IP-address hostname (Install-CloudGrange.ps1's default: the VM's IP) must be an
  IP SAN. As a DNS SAN, TLS clients that check the name properly (the cg CLI, curl, browsers) reject
  the certificate for https://<ip> even when its CA is trusted. */}}
  {{- if regexMatch `^[0-9]{1,3}(\.[0-9]{1,3}){3}$` .Values.global.hostname }}
  ipAddresses:
    - {{ .Values.global.hostname | quote }}
  {{- else }}
  dnsNames:
    - {{ .Values.global.hostname | quote }}
  {{- end }}
  duration: 2160h    # 90d
  renewBefore: 360h  # 15d
{{- end }}
