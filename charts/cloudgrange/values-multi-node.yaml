# Multi-node/HA profile skeleton. Full implementation (Redis deployment, CloudNativePG,
# multi-replica readiness) is AB#9190 — this file documents the intended overrides so the
# umbrella chart's shape doesn't need to change again when that work lands.
global:
  deployment:
    profile: multi-node
api:
  replicaCount: 2
  redis:
    enabled: true
    # AB#9190 stands up Redis itself (single-instance for multi-node, Sentinel for full ha)
    # and points this at its Service DNS name. Until then this profile is not deployable —
    # single-node remains the default and the only currently-supported path.
    connectionString: "REDIS_SERVICE_DNS_NAME:6379"
portal:
  replicaCount: 2
relay:
  replicaCount: 1  # relay HA (multiple relays per site) is a separate, later design question
postgres:
  highAvailability:
    enabled: true  # AB#9190: CloudNativePG operator replaces the single-Pod StatefulSet
