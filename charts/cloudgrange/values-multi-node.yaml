# AB#9190: multi-node/ha profile. Unlike the earlier skeleton version of this file, this
# is now real, deployable configuration — HA Postgres via CloudNativePG (installed as
# its own separate Helm release FIRST, same reasoning as cert-manager, AB#9179; see
# charts/cloudgrange/README.md's install sequence) and single-instance Redis for
# AB#9174's cross-pod relay dispatch bus.
#
# AB#9191: MetalLB is optional here. K3s's built-in ServiceLB answers the relay's LoadBalancer
# Service on every node's IP; MetalLB (metallb.enabled + addressPool) gives it one dedicated,
# floating address instead (AB#9171 corrected the earlier claim that it stays Pending).
global:
  # AB#9171: K3s's built-in Traefik (the BYO default is the cluster's default class).
  ingress:
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefikDefaultCertificate: true
  deployment:
    profile: multi-node

api:
  replicaCount: 2
  redis:
    enabled: true

portal:
  replicaCount: 2

relay:
  replicaCount: 1  # relay HA (multiple relays per site) is a separate, later design question
  service:
    type: LoadBalancer  # K3s ServiceLB answers on every node IP; AB#9171 made ClusterIP the BYO default

redis:
  enabled: true

postgres:
  highAvailability:
    enabled: true
    instances: 3

# AB#9171: managed foundation — same promtail settings as values-single-node.yaml.
observability:
  promtail:
    enabled: true
    raiseInotifyLimits: true
foundation:
  managed: true
# AB#9171: K3s ships Traefik and CloudGrange's installers install cert-manager before the chart,
# so the managed-foundation profiles turn on what the BYO defaults leave off.
certManager:
  installOperator: true
