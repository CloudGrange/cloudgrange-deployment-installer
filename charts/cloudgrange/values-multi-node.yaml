# AB#9190: multi-node/ha profile. Unlike the earlier skeleton version of this file, this
# is now real, deployable configuration — HA Postgres via CloudNativePG (installed as
# its own separate Helm release FIRST, same reasoning as cert-manager, AB#9179; see
# charts/cloudgrange/README.md's install sequence) and single-instance Redis for
# AB#9174's cross-pod relay dispatch bus.
#
# AB#9191 (MetalLB, still untouched) is the one piece this profile still assumes is
# handled separately: the relay's LoadBalancer Service needs MetalLB configured on
# bare-metal K3s for multiple nodes to give it a real routable address — without it the
# relay Service stays Pending, same as single-node today without MetalLB.
global:
  deployment:
    profile: multi-node

api:
  replicaCount: 2
  redis:
    enabled: true

portal:
  replicaCount: 2

relay:
  replicaCount: 1  # relay HA (multiple relays per site) is a separate, later design question

redis:
  enabled: true

postgres:
  highAvailability:
    enabled: true
    instances: 3
