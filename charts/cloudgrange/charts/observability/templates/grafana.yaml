apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-grafana
  labels: { app.kubernetes.io/name: cloudgrange-grafana }
spec:
  # AB#9187-class bug, found via a real K3s install (same fix as prometheus.yaml/
  # loki.yaml): this Deployment's exclusive-access RWO PVC needs Recreate, not the
  # default RollingUpdate, so the old pod fully releases its storage lock before the new
  # one starts.
  strategy:
    type: Recreate
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: cloudgrange-grafana } }
  template:
    metadata: { labels: { app.kubernetes.io/name: cloudgrange-grafana } }
    spec:
      # AB#9187: same class of bug as loki/prometheus/relay/api — grafana/grafana runs as
      # uid/gid 472, and Azure Disk CSI volumes come up root-owned. Fixed proactively here
      # (found the same pattern break loki/prometheus/relay on a real AKS test) rather than
      # waiting for grafana to hit the identical crash once its own PVC gets exercised.
      securityContext:
        fsGroup: 472
      # AB#8129: first-start "database is locked" (SQLite) — Grafana starts only after
      # Prometheus and Loki are healthy (same fix as the Compose stack's depends_on chain).
      initContainers:
        - name: wait-for-datasources
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://{{ .Release.Name }}-prometheus:9090/-/ready && \
                    wget -q -O /dev/null http://{{ .Release.Name }}-loki:3100/ready; do sleep 2; done
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          ports:
            - { containerPort: 3000 }
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: "{{ .Release.Name }}-secrets", key: grafana-admin-password } }
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            - name: GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED
              value: "true"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_DATABASE_WAL
              value: "true"
            - name: GF_DATABASE_TRANSACTION_RETRIES
              value: "40"
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-grafana-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-grafana-data
  labels: { app.kubernetes.io/part-of: cloudgrange }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.grafana.persistence.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana
  labels: { app.kubernetes.io/name: cloudgrange-grafana }
spec:
  selector: { app.kubernetes.io/name: cloudgrange-grafana }
  ports:
    - { port: 3000 }
