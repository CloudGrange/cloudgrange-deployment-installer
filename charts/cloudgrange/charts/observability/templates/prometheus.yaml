apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-prometheus
  labels: { app.kubernetes.io/name: cloudgrange-prometheus }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: cloudgrange-prometheus } }
  template:
    metadata: { labels: { app.kubernetes.io/name: cloudgrange-prometheus } }
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-remote-write-receiver
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: {{ .Release.Name }}-prometheus-config }
        - name: data
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-prometheus-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-prometheus-data
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.prometheus.persistence.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
  labels: { app.kubernetes.io/name: cloudgrange-prometheus }
spec:
  selector: { app.kubernetes.io/name: cloudgrange-prometheus }
  ports:
    - { port: 9090 }
