apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-prometheus
  labels: { app.kubernetes.io/name: cloudgrange-prometheus }
spec:
  # AB#9187-class bug, found via a real K3s install: this is a Deployment (not a
  # StatefulSet) backed by an exclusive-access RWO PVC — Prometheus holds a file lock on
  # its own TSDB directory. The default RollingUpdate strategy briefly runs the old and
  # new pod together, and the new one fails to open its data store ("resource temporarily
  # unavailable" — lock contention) because the old pod still holds the PVC. Recreate
  # forces the old pod to fully terminate (and release the PVC/lock) before the new one
  # starts, at the cost of a few seconds of downtime during upgrades — correct for a
  # single-replica singleton with exclusive storage.
  strategy:
    type: Recreate
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: cloudgrange-prometheus } }
  template:
    metadata: { labels: { app.kubernetes.io/name: cloudgrange-prometheus } }
    spec:
      # AB#9187: same class of bug as loki/api — prom/prometheus runs as uid/gid 65534
      # (nobody), and Azure Disk CSI volumes come up root-owned. Found via a real AKS test:
      # "open /prometheus/queries.active: permission denied", CrashLoopBackOff.
      securityContext: {{- include "cloudgrange.podSecurity" (dict "uid" 65534) | nindent 8 }}
      containers:
        - name: prometheus
          image: {{ include "cloudgrange.image" (dict "ref" .Values.prometheus.image "global" .Values.global) | quote }}
          securityContext: {{- include "cloudgrange.containerSecurity" . | nindent 12 }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-remote-write-receiver
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: {{ .Release.Name }}-prometheus-config }
        - name: data
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-prometheus-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-prometheus-data
  labels: { app.kubernetes.io/part-of: cloudgrange }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.prometheus.persistence.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
  labels: { app.kubernetes.io/name: cloudgrange-prometheus }
spec:
  selector: { app.kubernetes.io/name: cloudgrange-prometheus }
  ports:
    - { port: 9090 }
