apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      prometheusremotewrite:
        endpoint: http://{{ .Release.Name }}-prometheus:9090/api/v1/write
      otlphttp/loki:
        endpoint: http://{{ .Release.Name }}-loki:3100/otlp
      debug:
        verbosity: normal
    extensions:
      # 0.0.0.0, not 127.0.0.1 like the Compose config this was copied from: a Kubernetes
      # httpGet readinessProbe connects to the pod's IP from the kubelet, not localhost
      # inside the container, so a loopback-only bind makes the probe unreachable. Found
      # via a real k3d install (otel-collector pod never went Ready despite healthy logs).
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        traces: { receivers: [otlp], processors: [batch], exporters: [debug] }
        metrics: { receivers: [otlp], processors: [batch], exporters: [prometheusremotewrite] }
        logs: { receivers: [otlp], processors: [batch], exporters: [otlphttp/loki] }
