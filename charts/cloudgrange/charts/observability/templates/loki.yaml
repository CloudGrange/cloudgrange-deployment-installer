apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-loki
  labels: { app.kubernetes.io/name: cloudgrange-loki }
spec:
  # AB#9187-class bug, found via a real K3s install (same fix as prometheus.yaml/
  # grafana.yaml): this Deployment's exclusive-access RWO PVC needs Recreate, not the
  # default RollingUpdate, so the old pod fully releases its storage lock before the new
  # one starts.
  strategy:
    type: Recreate
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: cloudgrange-loki } }
  template:
    metadata: { labels: { app.kubernetes.io/name: cloudgrange-loki } }
    spec:
      # AB#9187: same class of bug as the API's PVC fix — grafana/loki runs as uid 10001,
      # and Azure Disk CSI volumes come up root-owned (unlike on-prem local-path-provisioner,
      # which happened to already be writable). Found via a real AKS test: "mkdir /loki/rules:
      # permission denied", CrashLoopBackOff. fsGroup makes kubelet chown the volume to this
      # GID at mount time on any provisioner — harmless, a no-op where already correctly owned.
      securityContext: {{- include "cloudgrange.podSecurity" (dict "uid" 10001) | nindent 8 }}
      containers:
        - name: loki
          image: {{ .Values.loki.image }}
          securityContext: {{- include "cloudgrange.containerSecurity" . | nindent 12 }}
          args: ["-config.file=/etc/loki/local-config.yaml"]
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: {{ .Release.Name }}-loki-config }
        - name: data
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-loki-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-loki-data
  labels: { app.kubernetes.io/part-of: cloudgrange }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.loki.persistence.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-loki
  labels: { app.kubernetes.io/name: cloudgrange-loki }
spec:
  selector: { app.kubernetes.io/name: cloudgrange-loki }
  ports:
    - { port: 3100 }
