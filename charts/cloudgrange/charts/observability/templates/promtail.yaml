{{- /* AB#9162/AB#9161: found while building the support-log-export feature — Loki was
completely unfed. The otel-collector only receives OTLP traces/metrics that apps actively
push (see configmap-otel.yaml); every service's actual stdout logs (Serilog for api/relay,
Keycloak, Postgres, nginx) go nowhere but `kubectl logs`. There was no log-shipping agent
at all. Promtail is the standard, minimal way to tail every container's stdout on each node
and ship it into Loki's native push API — this is what makes Loki (and everything that reads
from it: the support-bundle export, and eventually the audit/activity views) actually have
data instead of being empty by construction. Hand-written to match this subchart's existing
loki.yaml/prometheus.yaml/grafana.yaml pattern (plain Deployment/DaemonSet manifests, not a
vendored chart) rather than adding a new third-party chart dependency for one small agent. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-promtail
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-promtail
rules:
  # Read-only, cluster-wide: Promtail needs pod metadata (for labels on shipped log lines)
  # and the node's own container log files (mounted from the host below, not the API).
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-promtail
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-promtail
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-promtail-config
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://{{ .Release.Name }}-loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only this release's own namespace — a shared cluster (e.g. AKS with other
          # workloads) should not have Promtail hoovering up every pod's logs.
          - source_labels: [__meta_kubernetes_namespace]
            regex: {{ .Release.Namespace }}
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app_kubernetes_io_name
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-promtail
  labels: { app.kubernetes.io/name: cloudgrange-promtail }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: cloudgrange-promtail } }
  template:
    metadata: { labels: { app.kubernetes.io/name: cloudgrange-promtail } }
    spec:
      serviceAccountName: {{ .Release.Name }}-promtail
      # Reads the node's own container log directories — this is the one place in the
      # whole chart that legitimately needs hostPath + root, since container stdout on
      # every distro this chart targets (K3s, AKS, kind, etc.) lives on the node's disk,
      # not inside any pod's own filesystem.
      tolerations:
        - operator: Exists
      containers:
        - name: promtail
          image: grafana/promtail:3.7.7
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          volumeMounts:
            - { name: config, mountPath: /etc/promtail }
            - { name: varlog, mountPath: /var/log, readOnly: true }
            - { name: varlibdockercontainers, mountPath: /var/lib/docker/containers, readOnly: true }
            - { name: positions, mountPath: /run/promtail }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: {{ .Release.Name }}-promtail-config }
        - name: varlog
          hostPath: { path: /var/log }
        - name: varlibdockercontainers
          hostPath: { path: /var/lib/docker/containers }
        - name: positions
          emptyDir: {}
