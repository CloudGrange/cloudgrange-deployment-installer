apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-api-secrets
  labels: { app.kubernetes.io/part-of: cloudgrange }
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.secrets.size }}
{{- if and (not .Values.updater.hostPath.enabled) .Values.updater.pvc.enabled }}
---
# Only rendered where the updates directory is NOT a hostPath (AB#9189). On an appliance the
# host's updater service needs a real host directory it can read; a PVC there would be a
# channel the updater can never see.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-api-updates
  labels: { app.kubernetes.io/part-of: cloudgrange }
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.updates.size }}
{{- end }}
{{- if .Values.platformBundles.enabled }}
---
# AB#9171 (E7): uploaded offline Platform bundles. The API writes it; the Platform updater Job reads
# it (mounted read-only at /bundles). See platformBundles in values.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-platform-bundles
  labels: { app.kubernetes.io/part-of: cloudgrange, app.kubernetes.io/component: platform-updater }
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.platformBundles.size }}
{{- end }}
