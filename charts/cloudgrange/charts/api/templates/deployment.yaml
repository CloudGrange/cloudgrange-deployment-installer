{{- /* AB#9175/9177: migrations run in each pod at startup, guarded by the Postgres
advisory lock (CloudGrange.Api's RunMigrationsWithAdvisoryLock) — NOT a pre-install hook
Job. A real k3d install proved a pre-install hook Job doesn't work here: Helm runs ALL
pre-install hooks before ANY normal chart resource, so a hook Job would race against both
the shared Secret (templates/secrets.yaml, a normal resource) and the Postgres StatefulSet
(also normal) not existing yet on a fresh install — CreateContainerConfigError on the
Secret, guaranteed on every first install. The advisory lock already makes concurrent
pod-startup migrations fully race-safe (that's what actually fixes gap #3); a hook Job
would only have been an optimization to avoid the harmless per-pod migration check, and
it doesn't work without an unwind of chart structure that isn't worth it for that saving. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: cloudgrange-api
    app.kubernetes.io/part-of: cloudgrange
spec:
  # AB#9174: >1 replica needs Values.global.deployment.profile=multi-node so Redis-backed
  # relay dispatch is wired up (redis.enabled below) — otherwise a relay connected to one
  # pod is invisible to a job dispatched by another.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudgrange-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudgrange-api
        {{- if $.Values.global.aks.enabled }}
        # AB#9187 fix: found via a real AKS test that the CSI SecretProviderClass (which
        # sets clientID for Azure AD Workload Identity) had no actual workload-identity
        # wiring on this pod — the CSI driver would fail to authenticate to Key Vault with
        # no pod-managed-identity, VM-managed-identity, or federated workload identity
        # configured. This label + the ServiceAccount below (templates/aks/serviceaccount.yaml)
        # are the other required half of workload identity, paired with a federated
        # credential on the UAMI (created at cluster-setup time, not by this chart).
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      # AB#9197/AB#9171: the API runs as its own ServiceAccount, always. It holds the module-runtime
      # Role (creating a Deployment/Service per installed module) and the Platform-update Role
      # (creating the updater Job). On AKS this SA also carries the workload-identity annotation,
      # so it replaces the separate workload-identity SA rather than competing with it.
      serviceAccountName: {{ $.Release.Name }}-api
      {{- if and (gt (int .Values.replicaCount) 1) (eq .Values.persistence.accessMode "ReadWriteOnce") }}
      # AB#9171: ReadWriteOnce volumes attach to one node, so every replica must run there (see
      # persistence.accessMode in values.yaml). Set ReadWriteMany storage for node-level HA.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app.kubernetes.io/name: cloudgrange-api } }
              topologyKey: kubernetes.io/hostname
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # AB#9187 real bug, found via a live AKS test: without fsGroup, the api-secrets
        # PVC (mounted at /etc/cloudgrange) came up root-owned on Azure Disk CSI storage —
        # unlike on-prem local-path-provisioner volumes, which happened to already be
        # writable — and the app crashed on startup trying to create
        # /etc/cloudgrange/dataprotection-keys ("Permission denied"). fsGroup makes
        # kubelet chown the volume to this GID at mount time on any provisioner; harmless
        # and a no-op where it was already correctly owned.
        fsGroup: 1000
        # AB#9171: numeric user (the image's USER 1654) and RuntimeDefault seccomp for Pod Security
        # "restricted"; the container drops every capability below.
        runAsUser: 1654
        seccompProfile: { type: RuntimeDefault }
      # AB#9171 (C2, kind v1.34): the API exits when it cannot resolve or reach Postgres, so on a
      # fresh install it crash-looped until Postgres was up. Wait for it instead.
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.waitForPostgres.image }}
          command: ["sh", "-c", "until nc -z -w 2 {{ .Release.Name }}-postgres 5432; do echo waiting for {{ .Release.Name }}-postgres; sleep 2; done"]
          securityContext: {{- include "cloudgrange.containerSecurity" . | nindent 12 }}
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 32Mi } }
      containers:
        - name: api
          image: {{ include "cloudgrange.firstPartyImage" . | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext: {{- include "cloudgrange.containerSecurity" . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.port }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # AB#2514 fix: Platform Health's version card always showed "unknown" for every
            # component on K3s — these env vars were never set anywhere in the chart, and
            # GET /api/v1/platform/version falls back to "unknown" when unset. The first-party
            # tag (cloudgrange.imageTag: global.image.tag, else appVersion) is what's actually
            # deployed for api, portal and relay. AB#9171: Chart.AppVersion is the platform
            # version, stamped per release by scripts/release/Set-ChartVersion.sh.
            - name: CLOUDGRANGE_VERSION
              value: {{ include "cloudgrange.imageTag" . | quote }}
            - name: CLOUDGRANGE_PORTAL_VERSION
              value: {{ include "cloudgrange.imageTag" . | quote }}
            - name: CLOUDGRANGE_SOLUTION_VERSION
              value: {{ .Chart.AppVersion | quote }}
            # AB#9166 fix: the built-in relay never showed up connected/registered on K3s
            # installs — its own retry-forever enrollment loop kept 401ing because nothing
            # ever seeded core.relay_enrollment_tokens with a row matching its bootstrap
            # token. The API-side fix (SetupEndpoints.cs BootstrapBuiltinRelayEnrollmentAsync)
            # already existed and already runs on every setup completion — it was written
            # for the Compose engine, where cloudgrange-firstboot.sh sets this env var on the
            # API container; the K3s chart's API Deployment never set it at all, so the whole
            # bootstrap silently no-op'd (`RELAY_ENROLLMENT_TOKEN not set; skipping`). This is
            # the same bootstrap secret the relay pod already consumes (relay/templates/deployment.yaml).
            - name: RELAY_ENROLLMENT_TOKEN
              valueFrom: { secretKeyRef: { name: "{{ .Release.Name }}-secrets", key: relay-enrollment-token } }
            # AB#9162: the support-bundle export endpoint (GET /api/v1/support/export-logs)
            # queries Loki directly, the same way Grafana's provisioned datasource does.
            - name: LOKI_URL
              value: "http://{{ .Release.Name }}-loki:3100"
            # POSTGRES_PASSWORD must be defined BEFORE ConnectionStrings__Default below —
            # Kubernetes' $(VAR) env interpolation only resolves references to a PRECEDING
            # var in the same list; defined later (as it originally was here), $(VAR) is
            # left as a literal string and Postgres auth fails. Caught via a real k3d
            # install: the API crash-looped with "password authentication failed for user
            # cloudgrange" because the literal text "$(POSTGRES_PASSWORD)" was being sent
            # as the password.
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: "{{ .Release.Name }}-secrets", key: postgres-password } }
            - name: ConnectionStrings__Default
              value: "Host={{ .Release.Name }}-postgres;Port=5432;Database=cloudgrange;Username=cloudgrange;Password=$(POSTGRES_PASSWORD)"
            - name: OpenTelemetry__Endpoint
              value: "http://{{ .Release.Name }}-otel-collector:4317"
            - name: CLOUDGRANGE_PORTAL_URL
              value: "http://{{ .Release.Name }}-portal:8080"
            - name: Keycloak__Authority
              value: "http://{{ .Release.Name }}-keycloak:8080/realms/cloudgrange"
            - name: Keycloak__ClientId
              value: "cloudgrange-api"
            - name: Keycloak__ClientSecret
              valueFrom: { secretKeyRef: { name: "{{ .Release.Name }}-secrets", key: keycloak-api-client-secret } }
            - name: Keycloak__RequireHttpsMetadata
              value: "false"
            - name: CLOUDGRANGE_IMAGE_TAG
              value: {{ include "cloudgrange.imageTag" . | quote }}
            - name: CLOUDGRANGE_UPDATES_DIR
              value: "/var/lib/cloudgrange/updates"
            - name: CLOUDGRANGE_UPDATE_CHANNEL_URL
              {{- $ch := .Values.updateChannel }}
              {{- $name := $ch.name }}
              {{- if not $name }}
              {{- $v := include "cloudgrange.imageTag" . }}
              {{- $name = ternary "preview" (ternary "rc" "stable" (contains "-rc." $v)) (contains "-preview." $v) }}
              {{- end }}
              {{- if not (has $name (list "preview" "rc" "stable")) }}{{ fail (printf "api.updateChannel.name must be preview, rc or stable, got %q" $name) }}{{ end }}
              value: {{ $ch.url | default (printf "%s/channels/%s.json" (trimSuffix "/" $ch.baseUrl) $name) | quote }}
            # AB#9171: the module catalog is a static cg-module-catalog-v1 index on the same public
            # download host as the update channel. No credentials: the old GitHub packages listing
            # needed a token, so the catalog was empty on every customer install.
            - name: CLOUDGRANGE_MODULE_CATALOG_URL
              value: {{ .Values.moduleCatalog.url | default (printf "%s/modules/catalog.json" (trimSuffix "/" .Values.updateChannel.baseUrl)) | quote }}
            {{- if .Values.moduleCatalog.tokenSecret.name }}
            - name: CLOUDGRANGE_MODULE_CATALOG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.moduleCatalog.tokenSecret.name | quote }}
                  key: {{ .Values.moduleCatalog.tokenSecret.key | default "token" | quote }}
            {{- end }}
            {{- /* AB#9171 (plan 2026-09-18-foundation-platform-separation §4): the platform/update
            environment, rendered by the umbrella chart (templates/platform-env-configmap.yaml)
            because only it can see foundation.*, platformUpdater.* and its own kubeVersion.
            optional: true keeps this subchart renderable on its own and lets the updater keys be
            absent when platformUpdater.enabled=false. */}}
            {{- range list "CLOUDGRANGE_RELEASE_NAME" "CLOUDGRANGE_NAMESPACE" "CLOUDGRANGE_SUPPORTED_KUBE_RANGE" "CLOUDGRANGE_FOUNDATION_MANAGED" "CLOUDGRANGE_PLATFORM_VERSION" "CLOUDGRANGE_PLATFORM_UPDATER_ENABLED" "CLOUDGRANGE_PLATFORM_UPDATER_IMAGE" "CLOUDGRANGE_PLATFORM_UPDATER_SA" "CLOUDGRANGE_PLATFORM_UPDATER_BACKUP_PVC" "CLOUDGRANGE_PLATFORM_UPDATER_HEALTH_TIMEOUT" }}
            - name: {{ . }}
              valueFrom: { configMapKeyRef: { name: "{{ $.Release.Name }}-platform-env", key: {{ . }}, optional: true } }
            {{- end }}
            {{- if .Values.redis.enabled }}
            {{- /* AB#9190: the release name is only known at template-render time, so
            the Redis host is built here, not hardcoded into a values file — earlier
            values-multi-node.yaml had a REDIS_SERVICE_DNS_NAME:6379 placeholder for
            exactly this reason (couldn't know the real DNS name until now). */}}
            # AB#9174 — multi-node/ha profile only.
            - name: Redis__ConnectionString
              value: "{{ $.Release.Name }}-redis:6379"
            {{- end }}
          volumeMounts:
            - { name: api-secrets, mountPath: /etc/cloudgrange }
            - { name: platform-updates, mountPath: /var/lib/cloudgrange/updates }
            {{- if and .Values.global.aks.enabled .Values.global.aks.keyVaultSecrets }}
            # AB#9187: mounting the SecretProviderClass volume is what triggers the
            # Secrets Store CSI Driver to sync Key Vault values into the regular
            # {{ .Release.Name }}-secrets Secret (secretObjects, see
            # templates/aks/secretproviderclass.yaml) — the api pod doesn't read files
            # from this mount directly, every env var below still comes from
            # secretKeyRef against that synced Secret, unchanged from the on-prem path.
            - { name: azure-kv, mountPath: /mnt/azure-kv, readOnly: true }
            {{- end }}
          readinessProbe:
            httpGet: { path: /health/ready, port: {{ .Values.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: {{ .Values.port }} }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - { name: api-secrets, persistentVolumeClaim: { claimName: "{{ .Release.Name }}-api-secrets" } }
        {{- if .Values.updater.hostPath.enabled }}
        # AB#9189: must be a hostPath, not a PVC — the updater service runs on the host and
        # cannot read a PersistentVolume. See the updater block in this subchart's values.yaml.
        - name: platform-updates
          hostPath: { path: {{ .Values.updater.hostPath.path | quote }}, type: DirectoryOrCreate }
        {{- else if .Values.updater.pvc.enabled }}
        - { name: platform-updates, persistentVolumeClaim: { claimName: "{{ .Release.Name }}-api-updates" } }
        {{- else }}
        # AB#9171: no host updater and no PVC asked for — Platform updates run in-cluster (the
        # platform-updater Job), so the uploads directory only needs to exist.
        - { name: platform-updates, emptyDir: { sizeLimit: 1Gi } }
        {{- end }}
        {{- if and .Values.global.aks.enabled .Values.global.aks.keyVaultSecrets }}
        - name: azure-kv
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-azure-kv
        {{- end }}
