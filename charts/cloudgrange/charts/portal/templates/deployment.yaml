apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-portal
  labels:
    app.kubernetes.io/name: cloudgrange-portal
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudgrange-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudgrange-portal
    spec:
      # AB#9172: nginxinc/nginx-unprivileged image, uid 101 — no root capabilities needed.
      securityContext:
        runAsNonRoot: true
      containers:
        - name: portal
          image: "{{ .Values.global.image.registry }}/{{ .Values.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.port }}
          env:
            - name: CLOUDGRANGE_API_UPSTREAM
              value: "http://{{ .Release.Name }}-api:8080"
            - name: CLOUDGRANGE_API_URL
              value: ""
          readinessProbe:
            httpGet: { path: /, port: {{ .Values.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{ toYaml .Values.resources | nindent 12 }}
