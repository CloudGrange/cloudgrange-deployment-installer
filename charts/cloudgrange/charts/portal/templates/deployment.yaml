apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-portal
  labels:
    app.kubernetes.io/name: cloudgrange-portal
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudgrange-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudgrange-portal
    spec:
      # AB#9172: nginxinc/nginx-unprivileged image, uid 101 — no root capabilities needed.
      # runAsUser must be set explicitly: with only runAsNonRoot, Kubernetes refuses to
      # start a container whose image declares a non-numeric USER (CreateContainerConfigError,
      # "cannot verify user is non-root"). The image now declares USER 101 too, but pinning
      # it here keeps the chart correct against any image that regresses to a named user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }  # AB#9171: Pod Security "restricted"
      containers:
        - name: portal
          image: {{ include "cloudgrange.firstPartyImage" . | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext: {{- include "cloudgrange.containerSecurity" . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.port }}
          env:
            - name: CLOUDGRANGE_API_UPSTREAM
              value: "http://{{ .Release.Name }}-api:8080"
            - name: CLOUDGRANGE_API_URL
              value: ""
          # AB#9171: the platform's PUBLIC TLS certificate, served by the portal at
          # /downloads/platform-ca.crt so `cg auth login --ca-cert` works on self-signed installs.
          volumeMounts:
            - name: platform-tls
              mountPath: /etc/cloudgrange/platform-tls
              readOnly: true
          readinessProbe:
            httpGet: { path: /, port: {{ .Values.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        # Only the public keys of the ingress TLS Secret are projected (ca.crt: the issuing CA —
        # for the default self-signed issuer, the certificate itself; tls.crt: the served chain).
        # tls.key is never mounted. optional: a cluster whose TLS Secret does not exist (yet), or
        # has no ca.crt, still starts the portal; the endpoint then serves what exists, or 404.
        - name: platform-tls
          secret:
            secretName: {{ include "cloudgrange.tlsSecretName" . | quote }}
            optional: true
            defaultMode: 0444
            items:
              - { key: ca.crt, path: ca.crt }
              - { key: tls.crt, path: tls.crt }
