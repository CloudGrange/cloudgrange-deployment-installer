{{- /* AB#9177: single-node profile only — a 1-replica StatefulSet + PVC. The
multi-node/ha profile (AB#9190) replaces this with the CloudNativePG operator; guard
below so this template is inert once that lands and highAvailability.enabled flips. */ -}}
{{- if not .Values.highAvailability.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: cloudgrange-postgres
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudgrange-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudgrange-postgres
    spec:
      # AB#9193: a real Velero fs-backup recovery drill (run twice, reproduced both times)
      # found this StatefulSet's pod (single-node, non-CNPG path only) hangs at Init:0/1
      # after a Restore reaches Completed -- Velero's restore-wait init container polls a
      # `.velero/<uid>` marker file under an ephemeral `/restores` staging path the
      # node-agent controls, and gets "permission denied" reading it. Tried the standard
      # documented Velero fix (pod-level fsGroup, below) -- it did NOT resolve this in
      # real re-testing; the staging path is outside fsGroup's reach (it's not the PVC
      # mount itself). Kept anyway as good practice (correct group ownership for the
      # actual data volume), but the REAL, verified fix is operational: once the Restore
      # object shows phase=Completed, `kubectl delete pod cg-postgres-0` -- the actual PVC
      # byte-level data is already fully restored to disk by that point (proven via a real
      # `psql` query against the restored DB returning the correct row count, twice); only
      # the pod's own one-time readiness signal is stuck, and recreating the pod without
      # the ephemeral restore-wait injection mounts the (already-restored) volume normally
      # and comes up Ready within seconds. Documented in README.md's DR runbook.
      # AB#9171: run as the image's own postgres user (uid/gid 70 in the alpine image) instead of
      # starting as root and dropping privileges — what Pod Security "restricted" requires. The data
      # directory is already owned by 70 on existing installs (the entrypoint chowned it); fsGroup 70
      # lets a fresh volume's root accept the PGDATA subdirectory.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext: {{- include "cloudgrange.containerSecurity" . | nindent 12 }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "cloudgrange"
            - name: POSTGRES_USER
              value: "cloudgrange"
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: "{{ .Release.Name }}-secrets", key: postgres-password } }
            # AB#9187 real bug, found via a live AKS test: Azure Disk CSI (and many other
            # real CSI provisioners) creates a `lost+found` directory at the volume root —
            # initdb refuses to initialize a non-empty directory ("directory ... exists but
            # is not empty"), so the pod crash-looped forever on Azure Disk storage. K3s's
            # local-path-provisioner (used in every k3d test this session) happens not to
            # create one, which is exactly why this was never caught until a real cloud
            # disk was actually used. Standard fix (the official postgres image's own
            # documented recommendation for this situation): point PGDATA at a subdirectory
            # of the mount instead of the mount root itself.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "cloudgrange", "-d", "cloudgrange"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{ toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: { app.kubernetes.io/part-of: cloudgrange }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- end }}
