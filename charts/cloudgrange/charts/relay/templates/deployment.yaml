apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-relay
  labels:
    app.kubernetes.io/name: cloudgrange-relay
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudgrange-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudgrange-relay
    spec:
      # AB#9173: the relay already binds k.ListenAnyIP() — no host networking needed. It
      # reaches customer Hyper-V hosts via plain outbound HTTPS:5986 egress, independent of
      # this Deployment's network mode.
      #
      # AB#9187: same class of bug as loki/prometheus/api — the relay's Dockerfile runs as
      # uid/gid 999, and Azure Disk CSI volumes (the identity PVC, which also holds the
      # relay's local job-queue SQLite db) come up root-owned. Found via a real AKS test:
      # the relay crashed constructing AgentJobQueue, CrashLoopBackOff.
      #
      # AB#9171: runAsNonRoot needs a NUMERIC user — Kubernetes cannot verify the image's symbolic
      # `USER relay` without its /etc/passwd ("cannot verify user is non-root"). The image's relay
      # user is uid/gid 999 (`docker run --entrypoint id ghcr.io/cloudgrange/cloudgrange-relay`
      # prints uid=999(relay) gid=999(relay)), so pinning 999 here changes nothing at runtime and
      # lets the pod meet the Pod Security "restricted" profile together with the container
      # securityContext below.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: relay
          image: {{ include "cloudgrange.firstPartyImage" . | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: {{ .Values.port }}
          env:
            - name: RELAY_PAAS_URL
              value: "http://{{ .Release.Name }}-api:8080"
            - name: RELAY_ENROLLMENT_TOKEN
              valueFrom: { secretKeyRef: { name: "{{ .Release.Name }}-secrets", key: relay-enrollment-token } }
            - name: RELAY_DISPLAY_NAME
              value: {{ .Values.displayName | quote }}
            - name: RELAY_CLUSTER_ID
              value: {{ .Values.clusterId | quote }}
            - name: RELAY_LISTEN_PORT
              value: {{ .Values.port | quote }}
            - name: RELAY_IDENTITY_DIR
              value: "/var/lib/cloudgrange-relay/identity"
          volumeMounts:
            - { name: identity, mountPath: /var/lib/cloudgrange-relay/identity }
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - { name: identity, persistentVolumeClaim: { claimName: "{{ .Release.Name }}-relay-identity" } }
