replicaCount: 1
image:
  repository: cloudgrange-relay
  # AB#9171: optional sha256:<64 hex>. When set, the image renders as repo:tag@digest (pinned by
  # digest). The release tooling and the in-cluster Platform updater set it. The tag comes from
  # global.image.tag, or from this chart's appVersion when that is empty. Never latest.
  digest: ""
port: 8443
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 384Mi }
persistence:
  identity:
    size: 128Mi
displayName: site-relay
clusterId: default
# How Hyper-V agents on the customer LAN reach the relay (plain HTTP on this port today; the agent
# protocol has no TLS yet, see charts/cloudgrange/README.md). The portal and API reach it in-cluster
# either way.
#   ClusterIP (the DEFAULT, for bring-your-own Kubernetes): nothing is exposed outside the cluster
#     and nothing sits Pending on a cluster with no load-balancer implementation. Expose it the way
#     that cluster exposes TCP services — type LoadBalancer where the cluster has one, or NodePort.
#     An HTTP Ingress also works: the LAN agent API is plain HTTP under /lan/v1/.
#   LoadBalancer: the managed-foundation profiles (values-single-node.yaml,
#     values-multi-node.yaml) and AKS (values-azure.yaml). On K3s the built-in ServiceLB (klipper-lb)
#     answers it with the node IP(s) straight away; MetalLB (AB#9191) is only needed for a
#     dedicated, floating relay address. AKS provisions an Azure load balancer.
#   NodePort: set nodePort to pin the port (30000-32767); empty lets Kubernetes choose.
service:
  type: ClusterIP
  nodePort: ""
