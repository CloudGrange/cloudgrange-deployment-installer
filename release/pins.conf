# CloudGrange pins file — the ONE place a Foundation or tooling version is pinned (AB#9171,
# plan 2026-09-18-foundation-platform-separation.md A6/B5).
#
# KEY=VALUE only: no spaces around '=', no quotes, no shell expansion. It is sourced by bash
# (`. release/pins.conf`), read by the release scripts, and passed to `docker build` as build-args
# (images/platform-updater/Dockerfile). test/lint-pins.sh fails the build when any value here is
# missing, malformed or "latest", and when a script that still carries its own copy of a pin has
# drifted from the value here.
#
# Changing a pin: edit it here, run test/lint-pins.sh, and fix every drift it reports.

# --- Foundation (managed foundations only) -------------------------------------------------
# K3s: the version verified end to end on a real Hyper-V VM install (AB#9185).
# Copies that test/lint-pins.sh keeps in sync: scripts/Install-CloudGrangeK3s.sh (K3S_VERSION default).
K3S_VERSION=v1.36.4+k3s1

# Ubuntu 24.04 cloud image, by serial. The SHA-256 is Canonical's published hash for that serial.
# Download URL: https://cloud-images.ubuntu.com/noble/<serial>/noble-server-cloudimg-amd64.img
UBUNTU_CLOUDIMG_SERIAL=20260911
UBUNTU_CLOUDIMG_SHA256=612b2c0cc1bc413a6cb8c38fd611794caf0f2b436c50013d8b3794db12ad7354

# QEMU for Windows (qemu-img), used by the Windows script to convert the cloud image.
# Copies kept in sync: scripts/CloudGrange-Prereqs.ps1 ($script:CloudGrangeQemuVersion).
QEMU_WINDOWS_BUILD=20260811

# --- Tooling --------------------------------------------------------------------------------
# Helm: installed by scripts/Install-CloudGrangeK3s.sh on managed foundations, and shipped in the
# platform-updater image. Copies kept in sync: scripts/Install-CloudGrangeK3s.sh (helm_version).
HELM_VERSION=v3.22.0
HELM_LINUX_AMD64_SHA256=1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb

# kubectl in the platform-updater image. Matches the K3s minor above.
KUBECTL_VERSION=v1.36.4
KUBECTL_LINUX_AMD64_SHA256=8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a

# cosign in the platform-updater image (release-manifest signature verification).
COSIGN_VERSION=v3.1.3
COSIGN_LINUX_AMD64_SHA256=4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71

# platform-updater base image: the same Postgres 17.11 the chart runs, so pg_dump/psql match the
# server's major version. Pinned by tag AND index digest.
PLATFORM_UPDATER_BASE_IMAGE=postgres:17.11-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
