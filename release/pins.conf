# CloudGrange pins file — the ONE place a Foundation or tooling version is pinned (AB#9171,
# plan 2026-09-18-foundation-platform-separation.md A6/B5).
#
# KEY=VALUE only: no spaces around '=', no quotes, no shell expansion. It is sourced by bash
# (`. release/pins.conf`), read by the release scripts, and passed to `docker build` as build-args
# (images/platform-updater/Dockerfile). test/lint-pins.sh fails the build when any value here is
# missing, malformed or "latest", and when a script that still carries its own copy of a pin has
# drifted from the value here.
#
# Changing a pin: edit it here, run test/lint-pins.sh, and fix every drift it reports.

# --- Foundation (managed foundations only) -------------------------------------------------
# K3s: the version verified end to end on a real Hyper-V VM install (AB#9185).
# Copies that test/lint-pins.sh keeps in sync: scripts/Install-CloudGrangeK3s.sh (K3S_VERSION default).
K3S_VERSION=v1.36.4+k3s1
# The K3s install.sh at that tag (bundled for air-gapped installs by New-ReleaseBundleK3s.sh).
# Copies kept in sync: scripts/Install-CloudGrangeK3s.sh (K3S_INSTALL_SH_SHA256 default, online path).
K3S_INSTALL_SH_SHA256=46177d4c99440b4c0311b67233823a8e8a2fc09693f6c89af1a7161e152fbfad

# Ubuntu 24.04 cloud image, by serial. The SHA-256 is Canonical's published hash for that serial.
# Download URL: https://cloud-images.ubuntu.com/noble/<serial>/noble-server-cloudimg-amd64.img
UBUNTU_CLOUDIMG_SERIAL=20260911
UBUNTU_CLOUDIMG_SHA256=612b2c0cc1bc413a6cb8c38fd611794caf0f2b436c50013d8b3794db12ad7354

# QEMU for Windows (qemu-img), used by the Windows script to convert the cloud image.
# Copies kept in sync: scripts/CloudGrange-Prereqs.ps1 ($script:CloudGrangeQemuVersion).
QEMU_WINDOWS_BUILD=20260811

# --- Tooling --------------------------------------------------------------------------------
# Helm: installed by scripts/Install-CloudGrangeK3s.sh on managed foundations, and shipped in the
# platform-updater image. Copies kept in sync: scripts/Install-CloudGrangeK3s.sh (helm_version).
HELM_VERSION=v3.22.0
HELM_LINUX_AMD64_SHA256=1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb

# kubectl in the platform-updater image. Matches the K3s minor above.
KUBECTL_VERSION=v1.36.4
KUBECTL_LINUX_AMD64_SHA256=8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a

# cosign in the platform-updater image (release-manifest signature verification).
COSIGN_VERSION=v3.1.3
COSIGN_LINUX_AMD64_SHA256=4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71

# platform-updater base image: the same Postgres 17.11 the chart runs, so pg_dump/psql match the
# server's major version. Pinned by tag AND index digest.
PLATFORM_UPDATER_BASE_IMAGE=postgres:17.11-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995

# --- Chart images pinned by digest ------------------------------------------------------------
# The chart cannot read this file, so these are COPIES of what charts/cloudgrange values set;
# test/lint-pins.sh fails when the chart and this file disagree. Update both together.
# secretsBootstrap.image (kubectl within one minor of the supported Kubernetes range).
CHART_SECRETS_BOOTSTRAP_IMAGE=docker.io/alpine/k8s:1.36.4@sha256:358ddfc2d6ff3f00dd461dbd79aaa6d6738709f225b8da0945bb63bd4dbc304e
# observability.busybox.image (grafana wait-for-datasources, promtail inotify init).
CHART_BUSYBOX_IMAGE=busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
# observability.promtail.image
CHART_PROMTAIL_IMAGE=grafana/promtail:3.6.3@sha256:130b6dd63277d99ce87560c0266c0c30d07bc15ba0a8a590d42215465d4f5363

# --- Windows script base disk (AB#9171, plan C3) --------------------------------------------
# The pre-converted Hyper-V Gen2 base disk the Windows script downloads instead of converting the
# cloud image above with qemu-img on the customer's host. Built from UBUNTU_CLOUDIMG_SERIAL by
# scripts/release/New-UbuntuBaseVhdx.sh, which also writes these three values (--update-pins).
# A VHDX is not bit-reproducible (qemu-img writes fresh GUIDs into its headers), so the SHA-256s are
# those of the ONE artifact actually published at the URL. While they are empty the Windows script
# falls back to the qemu-img conversion (New-CloudGrangeVm.ps1 / CloudGrange-Prereqs.ps1).
# The "unpublished" marker goes on its own comment line directly above each empty value (see
# test/lint-pins.sh): a trailing comment would be read as the value by CloudGrange-Prereqs.ps1.
# unpublished: set by New-UbuntuBaseVhdx.sh --update-pins when the base VHDX is first published
UBUNTU_BASE_VHDX_ZIP_URL=
# unpublished: set with UBUNTU_BASE_VHDX_ZIP_URL
UBUNTU_BASE_VHDX_ZIP_SHA256=
# unpublished: set with UBUNTU_BASE_VHDX_ZIP_URL
UBUNTU_BASE_VHDX_SHA256=

# --- Foundation release (AB#9171, plan section 3) ---------------------------------------------
# The Foundation a fresh managed install lays down, and the channel foundation-check reads for newer
# ones. Separate versioning and cadence from the Platform. Copies kept in sync:
# scripts/Install-CloudGrangeK3s.sh (FOUNDATION_VERSION, FOUNDATION_CHANNEL_URL defaults).
FOUNDATION_VERSION=F2609.0.0
FOUNDATION_CHANNEL_URL=https://pub-ab113af532ff44ef827c176e42118f17.r2.dev/channels/foundation-preview.json
